<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NICOTT 콘텐츠 대시보드</title>
<link rel="icon" href="/assets/nicott-icon.png">
<link rel="apple-touch-icon" href="/assets/nicott-icon.png">
<meta name="theme-color" content="#2F4433">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;200;300;400;500;700;900&family=Questrial&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--sand:#D6C3B0;--terra:#E05A33;--cream:#ECEAE4;--forest:#2F4433;--paper:#FAF8F4;--sand-lt:#EAE0D5;
--ink:#2A2724;--ink-sub:#8C8377;--ui-bg:#F4F2EE;--ui-line:#E4DFD7;--ok:#4E7A52;--bad:#B24A3C;--warn:#B8842F;
--en:'Questrial',sans-serif;--kr:'Noto Sans KR',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--kr);color:var(--ink);background:var(--ui-bg);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#CFC8BC;border-radius:9px}
.app{display:grid;grid-template-columns:206px 1fr 392px;min-height:100vh}
.side{background:var(--forest);color:#fff;padding:18px 13px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--en);letter-spacing:.4em;font-size:15px;text-transform:uppercase}
.ver{font-size:10px;color:rgba(255,255,255,.45);margin-bottom:18px}
.nav{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.nav button{text-align:left;padding:8px 11px;border-radius:7px;font-size:13px;color:rgba(255,255,255,.72);display:flex;justify-content:space-between;gap:8px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:rgba(255,255,255,.14);color:#fff;font-weight:500}
.nav .n{font-family:var(--en);font-size:10.5px;opacity:.5}
.gm{border-top:1px solid rgba(255,255,255,.15);padding-top:13px}
.gm h4{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.5);margin-bottom:9px;font-weight:400}
.gmr{margin-bottom:8px}.gmr .t{display:flex;justify-content:space-between;font-size:10.5px;color:rgba(255,255,255,.8);margin-bottom:3px}
.gmb{height:4px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.gmb i{display:block;height:100%;background:var(--sand);border-radius:3px}.gmb i.over{background:var(--terra)}
.sfoot{margin-top:14px;font-size:9.5px;color:rgba(255,255,255,.4);line-height:1.7;border-top:1px solid rgba(255,255,255,.13);padding-top:10px}
main{padding:18px 22px 60px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:2px;flex-wrap:wrap}
.ph h1{font-size:21px;font-weight:300;letter-spacing:-.02em}
.ph .st{font-family:var(--en);font-size:11px;letter-spacing:.22em;color:var(--terra)}
.psub{color:var(--ink-sub);font-size:12px;margin-bottom:13px}
.card{background:#fff;border:1px solid var(--ui-line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card h3{font-size:13.5px;font-weight:500;margin-bottom:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.badge{font-family:var(--en);font-size:9.5px;letter-spacing:.1em;padding:2px 7px;border-radius:20px;background:var(--cream);color:var(--ink-sub)}
.badge.t{background:#FBEDE8;color:var(--terra)}
.hint{font-size:11px;color:var(--ink-sub);margin-bottom:10px;line-height:1.65}
.steps{display:flex;gap:6px;margin-bottom:13px;flex-wrap:wrap;align-items:center}
.steps div{font-size:11px;padding:5px 11px;border-radius:20px;background:#fff;border:1px solid var(--ui-line);color:var(--ink-sub)}
.steps div.on{background:var(--ink);border-color:var(--ink);color:#fff}
.steps div.done{background:var(--cream);border-color:var(--cream);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.chips button{font-size:11.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--ui-line);background:#fff;color:var(--ink-sub)}
.chips button:hover{border-color:var(--ink-sub)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips button .c{font-size:10px;opacity:.6;margin-left:4px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:10px}
.scard{background:#fff;border:1px solid var(--ui-line);border-radius:12px;padding:11px;text-align:left;position:relative}
.scard:hover{border-color:var(--ink-sub)}
.scard.on{border-color:var(--terra);box-shadow:0 0 0 2px rgba(224,90,51,.15)}
.scard .strip{display:flex;gap:3px;margin-bottom:8px}
.scard .strip .mini{flex:1;overflow:hidden;position:relative;background:var(--cream);border-radius:4px}
.scard .strip .mini .sc{position:absolute;top:0;left:0;transform-origin:top left}
.scard b{display:block;font-size:12.5px;font-weight:500}
.scard span{display:block;font-size:10.5px;color:var(--ink-sub);margin-top:2px;line-height:1.5}
.scard.new{border-style:dashed;display:flex;align-items:center;justify-content:center;min-height:140px;color:var(--ink-sub);font-size:12px;text-align:center}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:9px}
.tcard{background:#fff;border:1px solid var(--ui-line);border-radius:10px;overflow:hidden;text-align:left;position:relative}
.tcard:hover{border-color:var(--ink-sub)}
.tcard.on{border-color:var(--terra);box-shadow:0 0 0 2px rgba(224,90,51,.15)}
.tcard .th{width:100%;overflow:hidden;position:relative;background:var(--paper)}
.tcard .th .sc{position:absolute;top:0;left:0;transform-origin:top left}
.tcard .m{padding:6px 8px 8px}
.tcard .m b{display:block;font-size:11px;font-weight:500}
.tcard .m span{display:block;font-size:9.5px;color:var(--ink-sub);margin-top:1px}
.tcard .act{position:absolute;top:5px;right:5px;display:flex;gap:4px}
.tcard .act button{width:23px;height:23px;border-radius:7px;background:rgba(255,255,255,.92);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--ink-sub);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tcard .act button:hover{background:#fff;color:var(--ink)}
.tcard .act button.fav{color:var(--terra)}
.ratio{position:absolute;top:5px;left:5px;font-size:8.5px;padding:2px 6px;border-radius:20px;background:rgba(255,255,255,.9);color:var(--ink-sub);font-family:var(--en)}
.pstrip{display:flex;gap:7px;overflow-x:auto;padding:3px 3px 9px}
.pchip{flex:0 0 70px;border-radius:9px;overflow:hidden;border:2px solid transparent;background:#fff;position:relative}
.pchip.on{border-color:var(--terra)}
.pchip .th{width:100%;overflow:hidden;position:relative;background:var(--cream)}
.pchip .th .sc{position:absolute;top:0;left:0;transform-origin:top left}
.pchip .lb{font-size:8.5px;padding:3px;text-align:center;color:var(--ink-sub);background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px #fff}
.pchip .dot.ok{background:var(--ok)}
.padd{flex:0 0 70px;border:1.5px dashed var(--ui-line);border-radius:9px;color:var(--ink-sub);font-size:10.5px;display:flex;align-items:center;justify-content:center;min-height:92px;background:#fff}
.field{margin-bottom:10px}
.field label{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-sub);margin-bottom:4px;gap:8px}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],.field textarea,.field select{width:100%;padding:8px 10px;border:1px solid var(--ui-line);border-radius:8px;background:#fff;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--ink-sub)}
.field textarea{resize:vertical;min-height:52px;line-height:1.6}
.cnt{font-size:9.5px;color:var(--ink-sub)}
.fs{display:flex;gap:2px;align-items:center}
.fs button{width:19px;height:19px;border-radius:5px;background:var(--cream);font-size:11px;line-height:1;color:var(--ink-sub);display:flex;align-items:center;justify-content:center}
.fs span{font-size:9px;color:var(--ink-sub);min-width:24px;text-align:center;font-family:var(--en)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.drop{border:1.5px dashed var(--ui-line);border-radius:11px;padding:16px 14px;text-align:center;background:var(--paper)}
.drop.over{border-color:var(--terra);background:#FCF2EE}
.drop b{display:block;font-size:12.5px;font-weight:400;margin-bottom:2px}
.drop span{font-size:10.5px;color:var(--ink-sub)}
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-top:8px}
.samples button{aspect-ratio:1;border-radius:7px;border:2px solid transparent;background-size:cover;background-position:center}
.samples button:hover{border-color:var(--sand)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:7px}
.slot{border:1px solid var(--ui-line);border-radius:9px;padding:6px;background:#fff}
.slot .pv{width:100%;aspect-ratio:1;border-radius:6px;background:var(--cream) center/cover;margin-bottom:5px}
.slot b{font-size:10px;font-weight:500;display:block}
.slot span{font-size:9px;color:var(--ink-sub);display:block;margin-bottom:4px}
.capvars{display:flex;flex-direction:column;gap:7px;margin-bottom:9px}
.capvar{border:1px solid var(--ui-line);border-radius:9px;padding:9px 11px;background:#fff;text-align:left;font-size:11.5px;line-height:1.75;white-space:pre-wrap;color:#4a443b}
.capvar.on{border-color:var(--terra);background:#FEF9F7}
.capvar .lbl{font-family:var(--en);font-size:9px;letter-spacing:.16em;color:var(--terra);display:block;margin-bottom:4px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;align-items:center}
.btn{padding:7px 13px;border-radius:8px;font-size:12px;border:1px solid var(--ui-line);background:#fff;white-space:nowrap}
.btn:hover{border-color:var(--ink-sub)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#3d3833}
.btn.terra{background:var(--terra);color:#fff;border-color:var(--terra)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed;background:#f5f3ef}
.btn:disabled:hover{border-color:var(--ui-line)}
.why{font-size:10.5px;color:var(--ink-sub);margin-top:5px;line-height:1.6}.why b{color:var(--bad);font-weight:500}
.chk{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--ui-line);font-size:12px;align-items:flex-start;cursor:pointer}
.chk:last-of-type{border-bottom:0}
.chk input{margin-top:3px;width:15px;height:15px;accent-color:var(--forest);flex:0 0 15px}
.chk .auto{font-size:9.5px;padding:1px 7px;border-radius:20px;margin-left:auto;white-space:nowrap;align-self:center}
.chk .auto.pass{background:#E9F1E9;color:var(--ok)}.chk .auto.fail{background:#FBEAE6;color:var(--bad)}
.gate{border-radius:9px;padding:10px 12px;font-size:11.5px;margin-top:10px;line-height:1.7}
.gate.no{background:#FBEAE6;color:#8E3729}.gate.yes{background:#E9F1E9;color:#2F5233}
.gate.info{background:#EDF1F7;color:#3A5478}
.qrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ui-line)}
.qrow .th{width:36px;height:45px;border-radius:5px;background:var(--cream) center/cover;flex:0 0 36px}
.qrow .info{flex:1;min-width:0}.qrow .info b{display:block;font-size:12px;font-weight:500}
.qrow .info span{font-size:10.5px;color:var(--ink-sub)}
.tag{font-size:9.5px;padding:2px 8px;border-radius:20px;background:var(--cream);color:var(--ink-sub);white-space:nowrap}
.tag.draft{background:#EFEDE8}.tag.sch{background:#E8EDF5;color:#3F5B8B}.tag.due{background:#FBEDE8;color:var(--terra)}.tag.pub{background:#E9F1E9;color:var(--ok)}
.empty{text-align:center;padding:24px 14px;color:var(--ink-sub);font-size:11.5px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .hd{font-size:10.5px;color:var(--ink-sub);text-align:center;padding:4px 0}
.cal .d{min-height:66px;border:1px solid var(--ui-line);border-radius:8px;padding:5px;background:#fff;font-size:10.5px;position:relative;text-align:left}
.cal .d.out{background:#F7F5F2;color:#BDB6AA}
.cal .d.today{border-color:var(--terra)}
.cal .d .n{font-family:var(--en);font-size:11px;color:var(--ink-sub)}
.cal .d .ev{margin-top:3px;font-size:9px;padding:2px 4px;border-radius:4px;background:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .d .ev.p{background:#E8EDF5;color:#3F5B8B}.cal .d .ev.l{background:#EAF0E8;color:#4E7A52}
.cal .d .ev.s{background:#F4EDE4;color:#8A6A3E}.cal .d .ev.e{background:#FBEDE8;color:var(--terra)}
.cal .d{cursor:pointer;transition:.12s}
.cal .d:hover{border-color:var(--ink-sub);background:#FDFCFA}
.cal .d:not(.out):empty::after,.cal .d .plus{position:absolute;right:6px;bottom:5px;font-size:13px;color:#D5CEC2}
.cal .d .plus{opacity:0;transition:.12s}
.cal .d:hover .plus{opacity:1}
.cal .d.sel{border-color:var(--terra);box-shadow:0 0 0 2px rgba(224,90,51,.14)}
.cal .d .ev{display:flex;justify-content:space-between;gap:3px;align-items:center}
.cal .d .ev b{font-weight:400;overflow:hidden;text-overflow:ellipsis}
.cal .d .ev i{font-style:normal;opacity:.55;flex:0 0 auto;padding:0 1px}
.cal .d .ev i:hover{opacity:1;color:var(--bad)}
.dayp{border:1px solid var(--ui-line);border-radius:10px;padding:12px 14px;background:var(--paper);margin-top:11px}
.dayp h4{font-size:12.5px;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.wk{display:flex;gap:4px;flex-wrap:wrap}
.wk button{width:30px;height:30px;border-radius:8px;border:1px solid var(--ui-line);background:#fff;font-size:11.5px;color:var(--ink-sub)}
.wk button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.inl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inl input,.inl select{padding:6px 9px;border:1px solid var(--ui-line);border-radius:8px;font-size:12px;background:#fff}
.inl input[type=text]{flex:1;min-width:120px}
.kindpill{font-size:9.5px;padding:2px 7px;border-radius:20px;background:var(--cream);color:var(--ink-sub)}
.acc{border:1px solid var(--ui-line);border-radius:9px;overflow:hidden;margin-top:9px}
.acc>summary{padding:9px 12px;font-size:12px;cursor:pointer;background:#fff;list-style:none;display:flex;justify-content:space-between;align-items:center}
.acc>summary::-webkit-details-marker{display:none}
.acc>div{padding:10px 12px;border-top:1px solid var(--ui-line);background:var(--paper)}
.conn{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:20px}
.conn.on{background:#E9F1E9;color:var(--ok)}.conn.off{background:#F2EFEA;color:var(--ink-sub)}
/* preview */
.prev{background:#DEDAD3;padding:0 0 24px;position:sticky;top:0;height:100vh;overflow:auto;border-left:1px solid var(--ui-line)}
.pvbar{position:sticky;top:0;z-index:5;background:rgba(222,218,211,.96);backdrop-filter:blur(6px);padding:11px 15px;border-bottom:1px solid #CFC8BC;display:flex;gap:7px;align-items:center}
.pvbar .lbl{font-size:11px;color:#5b544a;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvbody{padding:13px 15px 0}
.stage{width:100%;background:#fff;border-radius:5px;overflow:hidden;position:relative;box-shadow:0 8px 26px rgba(42,39,36,.15)}
.stage .sc{position:absolute;top:0;left:0;transform-origin:top left}
.pnav{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:9px}
.pnav button{width:25px;height:25px;border-radius:6px;background:#fff;font-size:13px;color:var(--ink-sub)}
.pnav button:disabled{opacity:.35}
.pnav span{font-size:10.5px;color:#6f675c;font-family:var(--en);min-width:50px;text-align:center}
.srow{display:flex;align-items:center;gap:8px;margin-top:10px;background:#fff;border-radius:8px;padding:7px 10px}
.srow label{font-size:10.5px;color:var(--ink-sub);white-space:nowrap}
.srow input[type=range]{flex:1;accent-color:var(--terra)}
.srow b{font-size:10.5px;font-family:var(--en);min-width:32px;text-align:right}
.capprev{margin-top:9px;background:#fff;border-radius:9px;padding:10px 12px;font-size:11px;line-height:1.8;white-space:pre-wrap;color:#4a443b;max-height:150px;overflow:auto}
.capprev .h{font-size:9px;letter-spacing:.14em;color:var(--ink-sub);margin-bottom:5px;font-family:var(--en)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:12.5px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
/* ═══ 템플릿 캔버스 ═══ */
.tpl{position:relative;overflow:hidden;font-family:var(--kr);font-weight:300;--ts:1;width:var(--cw,1080px);height:var(--ch,1350px);background:var(--bg);color:var(--fg)}
.tpl .im{background-position:center;background-size:cover;background-repeat:no-repeat;background-color:#E7E2DA;border-radius:var(--rad)}
.sk-ever{--bg:#FAF8F4;--bg2:#EAE0D5;--panel:#ECEAE4;--fg:#2A2724;--sub:#8C8377;--acc:#E05A33;--edge:#DCD3C8;--rad:0px;--hw:200;--sh:0 44px 90px rgba(42,39,36,.16);--band:#D6C3B0;--dark:#2F4433}
.sk-edit{--bg:#ECEAE4;--bg2:#FAF8F4;--panel:#FAF8F4;--fg:#231F1C;--sub:#6E6558;--acc:#231F1C;--edge:#C6BDAE;--rad:0px;--hw:500;--sh:none;--band:#CFC6B6;--dark:#231F1C}
.sk-soft{--bg:#FBF7F1;--bg2:#F3EBDD;--panel:#FFFDFA;--fg:#4A423A;--sub:#9C9285;--acc:#C9A98C;--edge:#EBE3D7;--rad:30px;--hw:300;--sh:0 30px 66px rgba(42,39,36,.10);--band:#E7D9C6;--dark:#5C4C40}
.sk-bold{--bg:#2F4433;--bg2:#E05A33;--panel:#FAF8F4;--fg:#FAF8F4;--sub:rgba(250,248,244,.74);--acc:#D6C3B0;--edge:rgba(250,248,244,.3);--rad:0px;--hw:500;--sh:none;--band:#D6C3B0;--dark:#E05A33}
.wm{font-family:var(--en);letter-spacing:.44em;text-transform:uppercase;font-size:calc(26px*var(--ts));color:var(--fg)}
.wm.lt{color:#fff}
.hair{height:1px;background:var(--edge)}
.A1{display:flex;flex-direction:column;align-items:center}
.A1 .wm{margin-top:80px}.A1 .im{width:756px;height:756px;margin-top:80px}
.A1 .nm{margin-top:80px;font-size:calc(46px*var(--ts)*var(--f,1));font-weight:var(--hw);letter-spacing:-.02em}
.A1 .cl{margin-top:20px;font-family:var(--en);font-size:calc(24px*var(--ts));letter-spacing:.34em;color:var(--sub)}
.A1 .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);margin-top:40px}
.A2{background:var(--bg2)}
.A2 .tp{position:absolute;top:78px;left:84px;right:84px;display:flex;justify-content:space-between;align-items:center}
.A2 .kk{font-family:var(--en);font-size:calc(21px*var(--ts));letter-spacing:.3em;color:var(--acc)}
.A2 .hd{position:absolute;top:186px;left:84px;right:84px;font-size:calc(62px*var(--ts)*var(--f,1));font-weight:var(--hw);line-height:1.36;letter-spacing:-.025em}
.A2 .ld{position:absolute;top:400px;left:84px;right:120px;font-size:calc(29px*var(--ts)*var(--f2,1));line-height:1.7;color:var(--sub)}
.A2 .im{position:absolute;right:0;bottom:118px;width:796px;height:672px}

/* ═══════ v2.0 — 공용 협업판 UI (가독성·모바일·협업 흐름) ═══════
   색은 니코트 브랜드 리포트 팔레트 그대로(포레스트·샌드·크림·페이퍼·테라), 글자 대비만 끌어올림 */
:root{--ink:#1F1C19;--ink-sub:#4A433B;--ink-3:#5E564C;--ui-bg:#F3F0EA;--ui-line:#DCD4C8;--ui-line2:#C9BFB1;
--ok:#2F6B3A;--bad:#A23A2A;--warn:#8A5A12;--focus:#2F4433;--r-lg:14px;--r-md:10px;--r-sm:7px}
body{font-size:14px;color:var(--ink);background:var(--ui-bg)}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 레이아웃 — 미리보기 패널은 '만들기'에서만 */
.app{grid-template-columns:228px minmax(0,1fr) 400px}
.app.noprev{grid-template-columns:228px minmax(0,1fr)}
.app.noprev .prev{display:none}
.app.noprev main{max-width:1180px;width:100%}
main{padding:26px 30px 80px}

/* 사이드바 */
.side{padding:22px 14px 16px;display:flex;flex-direction:column}
.brandbox{padding:2px 10px 18px}
.brandbox .logo{height:19px;display:block;filter:invert(1) brightness(1.6)}
.brandbox .ver{font-size:12px;color:rgba(255,255,255,.82);margin-top:9px;margin-bottom:0}
.nav{gap:3px}
.nav button{font-size:14.5px;color:rgba(255,255,255,.9);padding:9px 11px;align-items:center;justify-content:flex-start;gap:10px;border-radius:9px}
.nav button svg{width:18px;height:18px;flex:0 0 18px;opacity:.9}
.nav button .lb{flex:1}
.nav button.on{background:rgba(255,255,255,.16);font-weight:500}
.nav .nb{font-family:var(--en);font-size:11.5px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--terra);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.gm h4{font-size:12.5px;letter-spacing:0;color:rgba(255,255,255,.86);font-weight:500}
.gmr .t{font-size:12.5px;color:#fff}

.who{display:flex;align-items:center;gap:9px}
.ava{width:30px;height:30px;border-radius:50%;background:var(--sand);color:var(--forest);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.who b{display:block;font-size:13.5px;font-weight:500}.who span{font-size:12px;color:rgba(255,255,255,.82)}
.who a{margin-left:auto;color:#fff;font-size:12px;text-decoration:underline;text-underline-offset:3px}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;margin-top:10px;color:rgba(255,255,255,.9)}
.sync i{width:8px;height:8px;border-radius:50%;background:#7FC48A;flex:0 0 8px}
.sync.busy i{background:var(--sand)}.sync.off i,.sync.err i{background:#F08A6E}
.sync.boot i{background:rgba(255,255,255,.6)}

/* 버튼 — 꺼진 버튼도 글자가 보이게 */

/* 상태 표시 — 진행 순서를 그대로 색으로 */
.stt{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;line-height:1.35}

.st-draft{background:#ECE7DF;color:#3D3731}
.st-review{background:#FCEBC7;color:#6B4708}
.st-changes{background:#FBE0D6;color:#8E2E1F}
.st-appr{background:#E1EEE3;color:#1F5A2A;box-shadow:inset 0 0 0 1.5px #A9CDB0}
.st-sch{background:#DFE8F4;color:#23456F}
.st-pub{background:#2F4433;color:#fff}
.st-fail{background:#A23A2A;color:#fff}
.st-trash{background:#E5E0D8;color:#4A433B}
.track{display:flex;gap:4px;margin:10px 0 4px}
.track span{flex:1;height:6px;border-radius:4px;background:#E2DBD0}
.track span.on{background:var(--forest)}.track span.cur{background:var(--terra)}
.track-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-sub)}

/* 콘텐츠 보드 */
.ctool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

.seg button.on{background:var(--forest);border-color:var(--forest);color:#fff}.seg button.on b{color:rgba(255,255,255,.85)}
.seg button.hot b{color:var(--terra);font-weight:700}.seg button.on.hot b{color:#FFD2C2}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ccard{background:#fff;border:1.5px solid var(--ui-line);border-radius:var(--r-lg);overflow:hidden;text-align:left;display:flex;flex-direction:column}

.ccard .mt{font-size:12.5px;color:var(--ink-sub)}
.ccard .cm{font-size:12px;font-weight:700;color:var(--ink-sub)}
.ccard .errl{font-size:12px;color:var(--bad);font-weight:500}
.ccard.rev{border-color:#E7B95A}
.ccard.chg{border-color:#E59C84}

/* 상세 서랍 */
.drawer-bg{position:fixed;inset:0;background:rgba(31,28,25,.38);z-index:60;opacity:0;pointer-events:none;transition:.18s}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--paper);z-index:61;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(31,28,25,.18)}
.drawer.on{transform:none}
.dhd{padding:18px 20px 12px;border-bottom:1px solid var(--ui-line);background:#fff}

.dpages .th{flex:0 0 150px;overflow:hidden;position:relative;background:var(--cream);border-radius:8px;box-shadow:0 2px 10px rgba(31,28,25,.1)}

.dsec{background:#fff;border:1px solid var(--ui-line);border-radius:12px;padding:13px 15px;margin-bottom:12px}

.dcap{white-space:pre-wrap;font-size:14px;line-height:1.75;color:var(--ink);max-height:220px;overflow:auto}

.tl{display:flex;flex-direction:column;gap:10px}
.tl .it{font-size:13.5px;line-height:1.6}

.tl .it .bd{white-space:pre-wrap;margin-top:3px}

.tl .it.changes .bd{background:#FBE7E1;color:#7E2717;border-radius:10px;padding:8px 11px;font-weight:500}
.tl .it.approve .bd{background:#E4EFE6;color:#1F4D27;border-radius:10px;padding:8px 11px;font-weight:500}
.cbox{display:flex;flex-direction:column;gap:8px;margin-top:12px}

.kpi.hot{border-color:#E59C84}.kpi.hot .v{color:#B23A17}

.hgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}

.feed .fi .tx span{display:block;color:var(--ink-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uprow{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ui-line);width:100%;text-align:left}
.uprow:last-child{border-bottom:0}
.uprow .d{font-family:var(--en);width:54px;flex:0 0 54px;text-align:center;line-height:1.2}
.uprow .d b{display:block;font-size:20px;font-weight:400}.uprow .d span{font-size:12px;color:var(--ink-sub)}
.uprow .tx{flex:1;min-width:0}.uprow .tx b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uprow .tx span{font-size:12.5px;color:var(--ink-sub)}
.perf{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ui-line)}
.perf .im{width:44px;height:55px;border-radius:6px;background:var(--cream) center/cover;flex:0 0 44px}
.perf .tx{flex:1;min-width:0;font-size:13px}.perf .tx b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perf .sc{font-family:var(--en);font-size:18px}

/* 표·설정 */
.utable{width:100%;border-collapse:collapse;font-size:13.5px}
.utable th{text-align:left;font-weight:700;color:var(--ink-sub);font-size:12.5px;padding:8px 6px;border-bottom:1.5px solid var(--ui-line2)}

.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px;margin:6px 0 12px}
.kv dt{color:var(--ink-sub);font-weight:500}.kv dd{color:var(--ink)}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(31,28,25,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:18px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:22px 22px 18px;box-shadow:0 24px 60px rgba(31,28,25,.25)}
.modal h3{font-size:17px;font-weight:500;margin-bottom:8px}
.modal p{font-size:14.5px;line-height:1.7;color:var(--ink);white-space:pre-wrap}
.modal .tools{justify-content:flex-end;margin:18px 0 0}
.busy-bg{position:fixed;inset:0;background:rgba(250,248,244,.86);z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:15px;font-weight:500}
.busy-bg.on{display:flex}
.busy-bg .sp{width:34px;height:34px;border-radius:50%;border:3px solid var(--ui-line2);border-top-color:var(--forest);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#offstage{position:fixed;left:0;top:0;width:0;height:0;overflow:hidden;pointer-events:none;z-index:-1}

/* 모바일 상단·하단 바 */
.mtop,.mtab,.pvfab{display:none}
@media (max-width:1180px){

}

  .ccard .cb{padding:9px 10px 11px}.ccard b{font-size:13.5px}

}
.sheet-bg{position:fixed;inset:0;background:rgba(31,28,25,.4);z-index:75;display:none}

<body>

<script>
/* ═══════════ NICOTT 대시보드 v1.0 ═══════════ */
const GUIDE={
 banned:['역대급','무조건 소장','안 사면 후회','지금 바로 GET','완전 핫한','대박','최저가','품절임박','서두르세요','🔥'],
 cta:{product:'여러분은 어떤 컬러가 가장 마음에 드세요?',plating:'오늘 저녁에는 어떤 메뉴를 담아볼까요?',event:'참여 방법은 프로필 링크에서 확인하실 수 있어요.'},

   {t:'화자가 NICOTT인지 NINA인지 명확한가',auto:'speaker'},{t:'니코트다운 담백한 말투인가'},
   {t:'지나친 유행어나 광고성 표현을 사용하지 않았는가',auto:'banned'},{t:'구매 링크와 CTA를 불필요하게 넣지 않았는가'},

};
const MIXLABEL={product:'제품·신상품',lifestyle:'브랜드·라이프스타일',story:'브랜드 스토리·제작',event:'고객참여·이벤트'};

 {id:'sk-edit',name:'에디토리얼',desc:'굵은 타이포·대비',sw:['#ECEAE4','#231F1C','#231F1C']},
 {id:'sk-soft',name:'소프트',desc:'라운드·크림',sw:['#FBF7F1','#F3EBDD','#C9A98C']},

 ['12','02','커트러리'],['12','04','여름 상차림'],['13','01','머그'],['13','03','핫초코'],['13','04','베어 브레드'],['13','05','디저트']]
 .map(([e,n,t])=>({name:t,url:B+'episode'+e+'/'+n+'.jpg'}));

function renderData(tpl,v,z){

}

}

async function api(method,path,body,ct){
  const opt={method,headers:{},credentials:'same-origin'};
  if(body!==undefined){if(ct){opt.headers['content-type']=ct;opt.body=body;}else{opt.headers['content-type']='application/json';opt.body=JSON.stringify(body);}}
  let r;
  try{r=await fetch('/api/'+path,opt);}catch(e){Cloud.state='offline';paintSync();const er=new Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.');er.offline=true;throw er;}
  let j={};try{j=await r.json();}catch(e){}
  if(r.status===401){location.href='/login?next='+encodeURIComponent(location.pathname+location.search);const er=new Error('로그인이 필요합니다');er.status=401;throw er;}
  if(!r.ok){const er=new Error(j.error||('서버 오류 '+r.status));er.status=r.status;er.data=j;throw er;}
  if(Cloud.state==='offline'||Cloud.state==='error')Cloud.state='ok';
  return j;
}

async function pushOnce(){
  if(!Cloud.ready)return false;
  if(!Cloud.dirty.size&&!Cloud.dirtyW.size&&!Cloud.removed.size)return true;
  Cloud.state='busy';paintSync();
  try{
    if(Cloud.dirtyW.size){const keys=[...Cloud.dirtyW];const set={};keys.forEach(k=>set[k]=DB[k]);Cloud.dirtyW.clear();
      try{const r=await api('PATCH','workspace',{set});Cloud.wsVersion=r.version;keys.forEach(k=>Cloud.base.w[k]=JSON.stringify(set[k]??null));}
      catch(e){keys.forEach(k=>Cloud.dirtyW.add(k));throw e;}}
    for(const id of [...Cloud.removed]){
      try{await api('POST',`contents/${id}/action`,{action:'trash'});}catch(e){if(![404,409].includes(e.status))throw e;}
      Cloud.removed.delete(id);delete Cloud.base.c[id];}
    for(const id of [...Cloud.dirty]){
      const c=DB.contents.find(x=>x.id===id);if(!c){Cloud.dirty.delete(id);continue;}
      await uploadInlineImages(c);
      const data=cPayload(c);if(!c.version)data.status=c.status==='planned'?'planned':'draft';
      else if(c.status==='planned'&&c._toDraft)data.status='draft';
      try{
        const r=await api('PUT','contents/'+id,{data,baseVersion:c.version||undefined,imported:c._import||undefined});
        Cloud.dirty.delete(id);mergeServer(r.content);
        if(r.reset)notice('승인된 콘텐츠의 내용이 바뀌어 예약이 풀렸습니다. 다시 검토·승인이 필요합니다.');
      }catch(e){
        if(e.status===409&&e.data?.current){Cloud.dirty.delete(id);mergeServer(e.data.current);notice(`'${c.title||'콘텐츠'}' — ${e.message}\n최신 내용으로 바꿨습니다.`);}
        else if(e.status===400||e.status===413){Cloud.dirty.delete(id);notice(`'${c.title||'콘텐츠'}' 저장 실패 — ${e.message}`);}
        else throw e;
      }}
    Cloud.state='ok';Cloud.err='';persistCache();return true;
  }catch(e){Cloud.state=e.offline?'offline':'error';Cloud.err=e.message;persistCache();setTimeout(()=>flush(),8000);return false;}
  finally{paintSync();if(S.view!=='make'&&!typingNow())softRender();}
}
function mergeServer(sc){if(!sc)return;const i=DB.contents.findIndex(x=>x.id===sc.id);

function applyState(s){
  Cloud.rev=s.rev;Cloud.me=s.me;Cloud.integrations=s.integrations||Cloud.integrations;Cloud.feed=s.feed||[];Cloud.insights=s.insights||null;
  const ws=s.workspace||{};Cloud.wsVersion=ws.version||0;
  WS_KEYS.forEach(k=>{if(Cloud.dirtyW.has(k))return;
    if(ws[k]!==undefined)DB[k]=k==='settings'?Object.assign(JSON.parse(JSON.stringify(DEF.settings)),ws[k]):ws[k];
    else if(Cloud.wsVersion===0&&Cloud.base.w[k]!==undefined)DB[k]=JSON.parse(JSON.stringify(DEF[k]));
    Cloud.base.w[k]=JSON.stringify(DB[k]??null);});
  const local=new Map(DB.contents.map(c=>[c.id,c]));
  const out=[];const seen=new Set();
  (s.contents||[]).forEach(sc=>{seen.add(sc.id);if(Cloud.removed.has(sc.id))return;
    if(Cloud.dirty.has(sc.id)&&local.has(sc.id)){const l=local.get(sc.id);l.version=sc.version;out.push(l);}
    else{out.push(sc);Cloud.base.c[sc.id]=cKey(sc);}});
  DB.contents.forEach(c=>{if(!seen.has(c.id)&&Cloud.dirty.has(c.id))out.unshift(c);});
  Object.keys(Cloud.base.c).forEach(id=>{if(!seen.has(id)&&!Cloud.dirty.has(id))delete Cloud.base.c[id];});
  DB.contents=out;
}

/* ── 이미지: 줄여서 올리고 공개 주소로 바꾸기 ── */
const MEDIA_CACHE=new Map();
async function prepImage(file){
  const du=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(file);});
  if(/gif$/i.test(file.type))return du;
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=du;});
    const MAX=2400,k=Math.min(1,MAX/Math.max(img.naturalWidth,img.naturalHeight));
    if(k>=1&&file.size<2.5e6&&/jpe?g$/i.test(file.type))return du;
    const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
    const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
    return cv.toDataURL('image/jpeg',.9);}catch(e){return du;}
}
async function uploadDataUrl(du){
  if(MEDIA_CACHE.has(du))return MEDIA_CACHE.get(du);
  const blob=await (await fetch(du)).blob();
  const r=await api('POST','media',blob,blob.type||'image/jpeg');
  MEDIA_CACHE.set(du,r.url);return r.url;
}
async function uploadInlineImages(c){
  for(const p of (c.pages||[]))for(const k of Object.keys(p.v||{})){const v=p.v[k];if(typeof v==='string'&&v.startsWith('data:image'))p.v[k]=await uploadDataUrl(v);}
  if(typeof c.thumb==='string'&&c.thumb.startsWith('data:'))c.thumb=await uploadDataUrl(c.thumb);
}
async function preloadImgs(p){
  const urls=Object.entries(p.v||{}).filter(([k,v])=>typeof v==='string'&&/^(data:|https?:|\/)/.test(v)&&/img|bg|photo/i.test(k)).map(([,v])=>v);
  await Promise.all(urls.map(u=>new Promise(r=>{const i=new Image();i.crossOrigin='anonymous';i.onload=i.onerror=()=>r();i.src=u;})));
}
async function renderPagesToJpeg(pages,skin){
  const host=document.getElementById('offstage');const out=[];
  try{for(const p0 of pages){const p={...p0,skin:p0.skin||skin||S.skin};const t=TB(p.tpl);
    host.innerHTML=`<div class="tpl ${p.skin} ${t.id}" style="--ts:${p.ts||1};--cw:${CW(t)}px;--ch:${CH(t)}px">${t.r(fullV(p,t),zf(p))}</div>`;
    await preloadImgs(p);await new Promise(r=>setTimeout(r,150));
    const cv=await html2canvas(host.firstElementChild,{scale:1,width:CW(t),height:CH(t),backgroundColor:'#FAF8F4',useCORS:true,logging:false});
    out.push(cv.toDataURL('image/jpeg',.92));}}
  finally{host.innerHTML='';}
  return out;
}
async function mediaFor(c){
  if(!(c.pages||[]).length)throw new Error('장이 없습니다');
  const bad=c.pages.some(p=>Object.entries(p.v||{}).some(([k,v])=>k.startsWith('img')&&v&&!isOwnImage(v)));
  if(bad){notice('드라이브 링크·샘플 사진이 들어 있어 게시용 이미지를 만들 수 없습니다.\n콘텐츠를 열어 직접 올린 사진으로 바꿔 주세요.');throw new Error('external');}
  busy(`게시용 이미지 만드는 중… (0/${c.pages.length})`);
  const imgs=await renderPagesToJpeg(c.pages,c.skin);const urls=[];
  for(let i=0;i<imgs.length;i++){busy(`게시용 이미지 올리는 중… (${i+1}/${imgs.length})`);urls.push(await uploadDataUrl(imgs[i]));}
  return urls;
}

async function act(id,action,extra={},quiet){
  await flush();
  const c=DB.contents.find(x=>x.id===id);
  try{const r=await api('POST',`contents/${id}/action`,{action,baseVersion:c?.version,...extra});
    if(r.purged){DB.contents=DB.contents.filter(x=>x.id!==id);delete Cloud.base.c[id];persistCache();}else mergeServer(r.content);
    const msg={request_review:'검토를 요청했습니다 — 관리자 화면에 표시됩니다',to_draft:'임시 저장으로 되돌렸습니다',request_changes:'수정을 요청했습니다',approve:'승인했습니다',schedule:'예약했습니다 — 시각이 되면 자동 게시됩니다',
      unschedule:'예약을 취소했습니다',publish_now:'게시했습니다',mark_published:'게시 완료로 기록했습니다',trash:'휴지통으로 옮겼습니다',restore:'되살렸습니다',purge:'영구 삭제했습니다'}[action];
    if(msg)toast(msg);

  }catch(e){if(e.data?.current)mergeServer(e.data.current);notice(e.message);render();if(quiet)throw e;return null;}
}
function buildRec(){
  const prev=DB.contents.find(c=>c.id===S.editingId);
  const bk=S.set?.bk||TB(S.pages[0].tpl).bk;
  const dEl=document.getElementById('schD'),tEl=document.getElementById('schT');
  const ds=(dEl?.value||'').trim(),ts=/^\d{2}:\d{2}$/.test(tEl?.value||'')?tEl.value:'19:00';
  const dt=/^\d{4}-\d{2}-\d{2}$/.test(ds)?new Date(ds+'T'+ts):null;
  const rec=Object.assign({},prev||{},{id:S.editingId||('C'+Date.now()),
    title:(S.set?.nm||'단일')+' · '+(S.pages[0].v.title||S.pages[0].v.name||S.pages[0].v.head||'').split('\n')[0].slice(0,18),
    setId:S.set?.id||null,skin:S.skin,speaker:S.speaker,bk,kind:prev?.kind||kindOf({bk}),channel:prev?.channel||(S.set?.story?'story':'feed'),
    pages:JSON.parse(JSON.stringify(S.pages)),caption:curCap(),

    createdAt:prev?.createdAt||new Date().toISOString(),thumb:S.pages[0].v.img1||''});

async function commitRec(rec){

  save();busy('공용 저장소에 저장하는 중…');

  if(Cloud.dirty.has(rec.id)||!saved?.version){notice('아직 서버에 저장하지 못했습니다. 이 기기에 보관해 두었다가 연결되면 자동으로 보냅니다.\n'+(Cloud.err||''));return null;}

function legacyData(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function legacyPending(){const L=legacyData();if(!L||!Array.isArray(L.contents))return[];
  const have=new Set(DB.contents.map(c=>c.id));return L.contents.filter(c=>c&&c.id&&!have.has(c.id));}
function migrateBanner(inSettings){
  if(!Cloud.ready)return'';const n=legacyPending().length;
  if(!n||(Cloud.legacyHidden&&!inSettings))return'';
  return `<div class="alert info"><span>이 기기에만 남아 있는 예전 콘텐츠가 <b>${n}건</b> 있습니다. 공용 저장소로 옮기면 팀 모두가 볼 수 있습니다.</span><button class="btn primary" onclick="migrateLegacy()">공용 저장소로 옮기기</button>${inSettings?'':`<button class="btn ghost" onclick="Cloud.legacyHidden=true;render()">나중에</button>`}</div>`;
}
async function migrateLegacy(){
  const L=legacyData();const list=legacyPending();if(!L)return;
  busy(`예전 콘텐츠 ${list.length}건을 옮기는 중…`);
  try{
    list.forEach(c0=>{const c=JSON.parse(JSON.stringify(c0));['status','version','mediaUrls','mediaId','permalink','publishedAt','lastError'].forEach(k=>delete c[k]);
      c._import=true;c.status='draft';DB.contents.unshift(c);});
    if(Cloud.wsVersion===0){['mySets','favTpl','favSet','archivedTpl','customTpl','pendingTpl','trend'].forEach(k=>{if(L[k]&&(!Array.isArray(L[k])||L[k].length))DB[k]=L[k];});
      if(L.settings){['handle','perWeek','goals','driveKey','driveFolder','driveLinks'].forEach(k=>{if(L.settings[k]!==undefined)DB.settings[k]=L.settings[k];});}}
    save();await flush();
    const left=legacyPending().length;
    try{localStorage.setItem(KEY+'_moved',new Date().toISOString());}catch(e){}
    busy(false);notice(left?`일부(${left}건)를 아직 못 옮겼습니다. 인터넷 연결을 확인한 뒤 다시 눌러 주세요.`:`${list.length}건을 공용 저장소로 옮겼습니다. 모두 '임시 저장' 상태로 들어갔습니다.\n(이 기기의 예전 데이터는 지우지 않고 그대로 둡니다.)`);
    render();
  }catch(e){busy(false);notice('옮기는 중 문제가 생겼습니다 — '+e.message);}
}

function ask(title,msg,okLabel='확인',noLabel='취소'){return new Promise(res=>{const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="tools">${noLabel?`<button class="btn" id="mNo">${esc(noLabel)}</button>`:''}<button class="btn primary" id="mOk">${esc(okLabel)}</button></div></div>`;
  m.classList.add('on');const done=v=>{m.classList.remove('on');m.innerHTML='';res(v);};
  document.getElementById('mOk').onclick=()=>done(true);const no=document.getElementById('mNo');if(no)no.onclick=()=>done(false);
  m.onclick=e=>{if(e.target===m)done(false);};setTimeout(()=>document.getElementById('mOk')?.focus(),20);});}

function askInput(title,msg,type='text'){return new Promise(res=>{const m=document.getElementById('modal');

  m.classList.add('on');const done=v=>{m.classList.remove('on');m.innerHTML='';res(v);};

  try{
    S.busy='드라이브 사진 불러오는 중…';render();
    const q=encodeURIComponent("'"+fm[0]+"' in parents and mimeType contains 'image/' and trashed=false");
    const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&pageSize=100&fields=files(id,name,thumbnailLink)&key='+encodeURIComponent(s.driveKey));

/* ══ 자동 생성 템플릿 수신·승인 ══

   대시보드가 이를 불러와 미리보기로 보여주고, 승인한 것만 갤러리에 들어갑니다. */
async function checkNewTemplates(silent){
  try{
    const r=await fetch('/data/templates/pending.json?t='+Date.now(),{credentials:'same-origin'});
    if(!r.ok){if(!silent)toast('아직 새 템플릿이 없습니다');DB.lastTplCheck=new Date().toISOString();save();return;}
    const j=await r.json();
    const list=(j.templates||[]).filter(t=>t&&t.id&&t.html&&(t.f||t.fields));
    const known=new Set([...T.map(t=>t.id),...(DB.customTpl||[]).map(t=>t.id),...(DB.pendingTpl||[]).map(t=>t.id)]);
    const fresh=list.filter(t=>!known.has(t.id));
    if(fresh.length){DB.pendingTpl=[...(DB.pendingTpl||[]),...fresh];}
    DB.lastTplCheck=new Date().toISOString();save();render();
    if(!silent||fresh.length)toast(fresh.length?`새 템플릿 ${fresh.length}종이 도착했습니다`:'새 템플릿이 없습니다');
  }catch(e){if(!silent)notice('새 템플릿을 불러오지 못했습니다 — '+e.message);}
}

const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function togDay(i){const a=S.rep.days,j=a.indexOf(i);j>=0?a.splice(j,1):a.push(i);a.sort();render();}

function mkEvent(kind,dateStr,time,title){
  const k=KINDS[kind]||KINDS.life,s=ALL_SETS().find(x=>x.id===k.set)||BASE_SETS[0];
  const tm=/^\d{2}:\d{2}$/.test(time)?time:'19:00';
  const dt=/^\d{4}-\d{2}-\d{2}$/.test(dateStr)?new Date(dateStr+'T'+tm):null;
  if(!dt||isNaN(dt.getTime()))throw new Error('날짜 형식이 올바르지 않습니다: '+dateStr);
  return {id:'C'+Date.now()+Math.floor(Math.random()*1000),title:title||k.nm,setId:s.id,skin:S.skin,speaker:s.sp,
    bk:k.bk,kind,channel:k.ch,pages:s.pages.map(newPage),caption:'',status:'planned',
    scheduledAt:dt.toISOString(),createdAt:new Date().toISOString(),thumb:''};
}
function addDayEvent(){
  const t=(document.getElementById('qTitle')?.value||'').trim();
  const k=document.getElementById('qKind')?.value||'life';
  const tm=/^\d{2}:\d{2}$/.test(document.getElementById('qTime')?.value||'')?document.getElementById('qTime').value:'19:00';
  if(!S.selDay)return;
  DB.contents.push(mkEvent(k,S.selDay,tm,t));save();render();toast('일정을 추가했습니다');
}
function applyRepeat(){
  const k=document.getElementById('rKind')?.value||'life';
  const tm=/^\d{2}:\d{2}$/.test(document.getElementById('rTime')?.value||'')?document.getElementById('rTime').value:'19:00';
  const span=document.getElementById('rSpan')?.value||'month';
  S.rep.kind=k;S.rep.time=tm;
  const today=new Date();today.setHours(0,0,0,0);
  const base=S.calMonth?new Date(S.calMonth+'-01'):new Date();
  let from,to;
  if(span==='4w'){from=new Date(today);to=new Date(today);to.setDate(to.getDate()+28);}
  else{const y=base.getFullYear(),m=base.getMonth();from=new Date(Math.max(new Date(y,m,1),today));to=new Date(y,m+1,0);}
  let n=0;
  for(let d=new Date(from);d<=to;d.setDate(d.getDate()+1)){
    if(!S.rep.days.includes(d.getDay()))continue;
    const ds=ymd(d);
    if(DB.contents.some(c=>c.status!=='trashed'&&c.scheduledAt&&ymd(new Date(c.scheduledAt))===ds&&c.kind===k))continue;
    DB.contents.push(mkEvent(k,ds,tm));n++;
  }
  save();render();toast(n?`계획 ${n}건을 일괄 추가했습니다`:'추가할 날짜가 없습니다');
}
function autoFill(){
  const mk=S.calMonth||thisMonth(),plan=proposePlan(mk);
  if(!plan.length){toast('이미 목표를 충족했습니다');return;}
  plan.forEach(p=>{const kind=Object.keys(KINDS).find(k=>KINDS[k].bk===p.bk&&KINDS[k].ch==='feed')||'life';
    if(!DB.contents.some(c=>c.status!=='trashed'&&c.scheduledAt&&ymd(new Date(c.scheduledAt))===p.date&&c.bk===p.bk))
      DB.contents.push(mkEvent(kind,p.date,'19:00'));});
  save();render();toast(`계획 ${plan.length}건을 캘린더에 채웠습니다`);
}
let PLAN=[];
function proposePlan(mk){
  const c=tally(mk),g=DB.settings.goals,target=Math.round(DB.settings.perWeek*4.3);
  const need=[];Object.keys(MIXLABEL).forEach(k=>{const want=Math.round(target*g[k]/100),have=c[k]||0;
    for(let i=0;i<Math.max(0,want-have);i++)need.push(k);});
  const setFor={product:'S1',lifestyle:'S5',story:'S3',event:'S4'};
  const [y,m]=mk.split('-').map(Number);
  const today=new Date();const startDay=(today.getFullYear()===y&&today.getMonth()+1===m)?today.getDate()+1:1;
  const daysInM=new Date(y,m,0).getDate();
  const gap=Math.max(1,Math.floor(7/DB.settings.perWeek));
  PLAN=need.slice(0,24).map((bk,i)=>{
    let day=startDay+i*gap;if(day>daysInM)day=daysInM;
    const s=ALL_SETS().find(x=>x.id===setFor[bk])||BASE_SETS[0];
    return{bk,setId:s.id,setName:s.nm,date:`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`,
      why:`${MIXLABEL[bk]} 부족분 보충`};});
  return PLAN;
}
function addPlan(i){const p=PLAN[i];if(!p)return;
  const s=ALL_SETS().find(x=>x.id===p.setId);
  DB.contents.push({id:'C'+Date.now()+i,title:`(계획) ${s.nm}`,setId:s.id,skin:S.skin,speaker:s.sp,bk:p.bk,
    pages:s.pages.map(newPage),caption:'',status:'planned',scheduledAt:new Date(p.date+'T19:00').toISOString(),
    createdAt:new Date().toISOString(),thumb:''});
  save();render();toast('캘린더에 계획을 추가했습니다');}
function addAllPlan(){PLAN.forEach((_,i)=>addPlan(i));toast('제안을 모두 추가했습니다');}

const CG={in:{name:'',memo:'',col:'',cat:'',gift:false},v:new Array(41).fill(''),feats:[],busy:''};
function cgDetect(){
  const n=(CG.in.name||'').toLowerCase();
  let col=CG.in.col,cat=CG.in.cat;
  if(!col)for(const k in CG_COLS)if(CG_COLS[k].kw.some(w=>n.includes(w.toLowerCase()))){col=k;break;}
  if(!cat)for(const k in CG_CATS)if(CG_CATS[k].kw.some(w=>n.includes(w.toLowerCase()))){cat=k;break;}
  return{col:col||'',cat:cat||''};
}
function cgParse(){
  const m=CG.in.memo||'',lines=m.split('\n').map(s=>s.trim()).filter(Boolean);
  const pick=(re)=>{const x=m.match(re);return x?x[0]:'';};
  const MATS=['내열유리','고온소성 도자기','도자기','유리','스테인리스','원목','린넨','라탄','면 100%','실리콘','옹기'];
  const mat=MATS.find(w=>m.includes(w))||'';
  const sizes=(m.match(/\d+(?:\.\d+)?\s*(?:cm|mm|ml|L)/g)||[]).slice(0,5).join(' · ');
  const comp=pick(/[^,\n·]*\d+\s*[Pp인개][^,\n·]*/);
  const orgMap={'일본':'일본','국내':'대한민국','대한민국':'대한민국','한국':'대한민국','중국':'중국','베트남':'베트남'};
  let org='';for(const k in orgMap)if(m.includes(k)){org=orgMap[k];break;}
  const COLORS=['밀크','화이트','아이보리','베이지','샌드','브라운','그린','블루','블랙','그레이','핑크','옐로우','테라코타'];
  const colors=COLORS.filter(c=>m.includes(c)).join(' · ');
  const USES=['커피','라떼','밀크티','차','에이드','아이스티','파스타','샐러드','밥','국','반찬','디저트','과일','브런치','안주'];
  const use=USES.filter(u=>m.includes(u)).join(' · ');
  const feats=lines.filter(l=>/^[-·•*]/.test(l)).map(l=>l.replace(/^[-·•*]\s*/,'')).slice(0,3);
  return{mat,size:sizes,comp:comp.trim(),org,colors,use,feats};
}

  v[8]=[(F.comp?'구성은 '+F.comp+'.':''),(F.colors?'컬러는 '+F.colors+' 중에서 고를 수 있습니다.':''),'취향과 식탁에 맞게 선택해 보세요.'].filter(Boolean).join('\n');

  v[15]=F.colors?'컬러 사진':'X';v[16]=F.colors?(F.colors+' — 실물 기준 컬러칩 첨부'):'X';v[17]='X';
  v[19]=(P.tags?P.tags+' ':'')+'#니코트 #지금의식탁 #일상의낭만';
  v[21]=['CHECK POINT','',short+',','일상이 더 좋아지는 이유','','DESIGN','MATERIAL','PACKAGE',''].concat(feats.map((f,n)=>'POINT.0'+(n+1)+' '+f+'\n')).join('\n').trim();
  const PT=['DESIGN DETAIL','MATERIAL','HOW TO USE'];

    :n===1?((F.mat?F.mat+'. ':'')+'오래 쓸수록 좋은 도구의 기본을 지켰습니다.')
    :('생활 속에서 이렇게 활용해 보세요.\n'+(F.use||'매일의 식탁에서'))].join('\n');});
  v[29]=['구성',(F.comp||i.name.trim()),(F.size?'사이즈 — '+F.size:'')].filter(Boolean).join('\n');

}
async function cgAI(){
  if(!Cloud.integrations.ai?.connected){notice(isAdmin()?'설정 → 연결에서 AI 키를 등록하면 [완전 자동]이 켜집니다.':'AI 키가 아직 등록되지 않았습니다. 관리자에게 요청해 주세요.');return;}
  if(!cgGen())return;
  CG.busy='AI가 원고를 쓰는 중… (10~20초)';render();
  try{
    const i=CG.in,det=cgDetect(),F=cgParse(),P=CG_COLS[det.col]||{};
    const spec=['너는 테이블웨어 브랜드 니코트(NICOTT)의 카피라이터다. 상세페이지 원고를 쓴다.','',
      '## 브랜드 톤','담백하고 차분하게. 감성적이지만 과장 없이. 짧은 문장. 존댓말.',
      '금지 표현: '+GUIDE.banned.join(', '),'',
      '## 제품 팩트','상품명: '+i.name,'컬렉션: '+(det.col||'미지정'),'카테고리: '+(det.cat||'미지정'),
      '메모(발주서·스펙): '+(i.memo||'없음'),'기프트 패키지: '+(i.gift?'있음':'없음'),
      (P.desc?'컬렉션 설명(참고): '+P.desc:''),'',
      '## 할 일','메모에서 핵심 특징 3가지를 뽑고, 아래 JSON만 출력한다. 설명 문장 금지. 코드블록 표시 금지.','',
      '{','"feats": ["특징1(15자 내)","특징2","특징3"],',
      '"mod": "수식어 두 줄 (줄바꿈은 \\n)",',
      '"sp1": "대표 소구포인트1 — 4~7문장, 문단 사이 빈 줄",',
      '"sp2": "대표 소구포인트2 — 구성·선택지 안내 2~4문장",',
      '"detail": "추천 용도\\n(용도 나열)\\n\\n감성 한 줄\\n\\n(한 문장)",',
      '"check": "CHECK POINT\\n\\n(제품명),\\n일상이 더 좋아지는 이유\\n\\nDESIGN\\nMATERIAL\\nPACKAGE\\n\\nPOINT.01 …\\n\\nPOINT.02 …\\n\\nPOINT.03 …",',
      '"points": ["DESIGN DETAIL\\n제목\\n---------------------\\n\\n본문 2~3문장","MATERIAL\\n…","HOW TO USE\\n…"],',
      '"tags": "#해시태그 5~7개 (공백 구분, #니코트 포함)"','}'].filter(Boolean).join('\n');
    const j=await api('POST','ai',{prompt:spec,max_tokens:2500});
    const m=(j.text||'').match(/\{[\s\S]*\}/);if(!m)throw new Error('응답에서 JSON을 찾지 못했습니다');
    const o=JSON.parse(m[0]);
    const found=GUIDE.banned.filter(b=>JSON.stringify(o).includes(b));
    if(found.length)throw new Error('금지 표현 포함으로 반려: '+found.join(', '));
    if(Array.isArray(o.feats)&&o.feats.length)CG.feats=o.feats.slice(0,3);
    if(o.mod)CG.v[4]=o.mod;if(o.sp1)CG.v[6]=o.sp1;if(o.sp2)CG.v[8]=o.sp2;
    if(o.detail)CG.v[14]=o.detail;if(o.check)CG.v[21]=o.check;
    (o.points||[]).slice(0,3).forEach((p,n)=>{if(p)CG.v[23+n*2]=p;});
    if(o.tags)CG.v[19]=o.tags;
    toast('AI 원고 완성 — 검토 후 복사하세요');
  }catch(e){notice('AI 생성 실패 — 규칙 기반 초안을 그대로 둡니다.\n\n'+e.message);}
  finally{CG.busy='';render();}
}
async function cgCopyRow(){
  if(!CG.v[5]){toast('먼저 원고를 생성하세요');return;}
  const es=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const html='<table><tr>'+CG.v.map(x=>'<td>'+es(x).replace(/\n/g,'<br>')+'</td>').join('')+'</tr></table>';
  const plain=CG.v.map(x=>String(x).replace(/\t/g,' ')).join('\t');
  try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]);
    toast('복사 완료 — 시트 새 행 A열에 붙여넣으세요 (줄바꿈 보존)');}
  catch(e){try{await navigator.clipboard.writeText(plain);toast('텍스트로 복사했습니다');}catch(e2){toast('복사 실패: '+e2.message);}}
}

   <div class="hint">켜면 <b>제품 원고 [완전 자동]</b>과 <b>캡션 AI 안</b>을 쓸 수 있습니다. 키는 서버에만 저장되고 브라우저로 내려오지 않습니다. 금지 표현이 들어간 결과는 자동으로 걸러집니다.</div>
   ${isAdmin()?`${legacyAi&&!ai.connected?`<div class="alert info">이 기기에 예전 버전에서 넣어 둔 AI 키가 있습니다.<button class="btn primary" onclick="aiSave(true)">그 키로 켜기</button></div>`:''}
    <div class="grid2"><div class="field"><label><span>Anthropic API 키 ${ai.connected?'(바꿀 때만)':''}</span></label><input type="password" id="aiKey" placeholder="sk-ant-…" autocomplete="off"></div>
    <div class="field"><label><span>모델</span></label><select id="aiModel">${[['claude-haiku-5-5','Haiku — 빠르고 저렴 (권장 시작점)'],['claude-sonnet-5-5','Sonnet — 감성 카피가 더 안정적']].map(([v,l])=>`<option value="${v}" ${(ai.model||'claude-haiku-5-5')===v?'selected':''}>${l}</option>`).join('')}</select></div></div>
    <div class="tools"><button class="btn primary" onclick="aiSave()">저장</button>${ai.connected?'<button class="btn danger" onclick="aiOff()">끄기</button>':''}</div>`:'<div class="why">설정은 관리자만 바꿀 수 있습니다.</div>'}</div>
  ${isAdmin()?`<div class="card"><h3>사용자 관리 <span class="badge">${(Cloud.users||[]).length}명</span></h3>
   <div class="hint">사람마다 계정을 만들면 작성자·승인자·댓글이 이름으로 남습니다. <b>작성자</b>는 만들고 검토 요청까지, <b>관리자</b>는 승인·예약·연결까지 합니다.</div>
   ${Cloud.users===null?'<div class="empty">불러오는 중…</div>':Cloud.users.length?`<table class="utable"><thead><tr><th>이름</th><th>아이디</th><th>마지막 접속</th><th>권한</th><th></th></tr></thead><tbody>
     ${Cloud.users.map(u=>`<tr style="${u.active?'':'opacity:.62'}"><td><b>${esc(u.name)}</b>${u.active?'':' (중지)'}</td><td>${esc(u.login)}</td><td>${u.last_login?dt(u.last_login):'—'}</td>
       <td><select onchange="userPatch('${u.id}',{role:this.value})" aria-label="권한"><option value="editor" ${u.role==='editor'?'selected':''}>작성자</option><option value="admin" ${u.role==='admin'?'selected':''}>관리자</option></select></td>
       <td style="text-align:right;white-space:nowrap"><button class="btn sm" onclick="userResetPw('${u.id}','${esc(u.name)}')">비밀번호</button> <button class="btn sm" onclick="userPatch('${u.id}',{active:${u.active?0:1}})">${u.active?'중지':'재개'}</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">아직 개인 계정이 없습니다.</div>'}
   <details class="acc"${Cloud.users&&!Cloud.users.length?' open':''}><summary><span>새 계정 만들기</span><span class="cnt">펼치기</span></summary><div>
    <div class="grid2"><div class="field"><label><span>이름 (화면에 보이는 이름)</span></label><input type="text" id="nuName" placeholder="예: 니나"></div>
    <div class="field"><label><span>아이디 (영문 소문자·숫자)</span></label><input type="text" id="nuLogin" placeholder="예: nina" autocapitalize="off"></div>
    <div class="field"><label><span>처음 비밀번호 (8자 이상 — 본인이 나중에 바꿈)</span></label><input type="password" id="nuPw" autocomplete="new-password"></div>
    <div class="field"><label><span>권한</span></label><select id="nuRole"><option value="editor">작성자</option><option value="admin">관리자</option></select></div></div>
    <div class="tools"><button class="btn primary" onclick="userCreate()">계정 만들기</button></div></div></details></div>`:''}
  <div class="card"><h3>게시 목표</h3><div class="hint">주간 게시 횟수와 콘텐츠 비율입니다. 캘린더 제안과 비율 게이지가 이 값을 기준으로 계산됩니다.</div>
   <div class="field"><label><span>주간 게시 횟수</span><span class="cnt">${s.perWeek}회 · 월 약 ${Math.round(s.perWeek*4.3)}건</span></label>
    <input type="range" min="1" max="10" value="${s.perWeek}" ${isAdmin()?'':'disabled'} oninput="setGoal('perWeek',this.value)" style="width:100%;accent-color:var(--forest)"></div>
   <div class="grid2">${Object.keys(MIXLABEL).map(k=>`<div class="field"><label><span>${MIXLABEL[k]}</span><span class="cnt">${s.goals[k]}%</span></label>
     <input type="range" min="0" max="60" value="${s.goals[k]}" ${isAdmin()?'':'disabled'} oninput="setGoal('${k}',this.value)" style="width:100%;accent-color:var(--forest)"></div>`).join('')}</div>
   <div class="gate ${sum===100?'yes':'no'}">합계 ${sum}% ${sum===100?'— 정확합니다':'— 100%가 되도록 조정해 주세요'}</div></div>
  <div class="card"><h3>구글 드라이브 사진</h3>
   <div class="hint">① 파일을 <b>드래그해서 올리기</b>(가장 확실) · ② 드라이브 <b>공유 링크 붙여넣기</b> · ③ 폴더 링크와 키를 넣으면 <b>드라이브에서 바로 고르기</b>. 게시용 이미지는 ①로 올린 사진만 만들 수 있습니다.</div>
   <div class="field"><label><span>자주 쓰는 드라이브 링크 (줄바꿈으로 여러 개)</span></label>
    <textarea style="min-height:70px" oninput="setS('driveLinks',this.value)">${esc(s.driveLinks||'')}</textarea></div>
   <div class="field"><label><span>사진 폴더 링크 (폴더째 공유)</span></label><input type="text" placeholder="https://drive.google.com/drive/folders/..." value="${esc(s.driveFolder||'')}" oninput="setS('driveFolder',this.value)"></div>
   <div class="field"><label><span>Google API 키 (선택 · 공개 폴더 읽기 전용)</span></label><input type="text" placeholder="AIza... — 넣으면 선택기가 켜집니다" value="${esc(s.driveKey||'')}" oninput="setS('driveKey',this.value)"></div></div>
  <div class="card"><h3>데이터</h3>
   <div class="hint">콘텐츠·세트·설정은 <b>공용 저장소</b>에 저장됩니다. 어느 기기·어느 계정으로 들어와도 같은 내용이 보입니다. 지운 콘텐츠는 휴지통에 남습니다.</div>
   ${migrateBanner(true)}
   <div class="tools"><button class="btn" onclick="backup()">백업 파일 내려받기</button><button class="btn" onclick="clearLocalCache()">이 기기 임시 사본 비우기</button></div>
   <div class="why">콘텐츠 ${DB.contents.filter(c=>c.status!=='trashed').length}건 · 휴지통 ${DB.contents.filter(c=>c.status==='trashed').length}건 · 내 세트 ${DB.mySets.length}개 · 즐겨찾기 ${DB.favTpl.length}종 · 보관 ${DB.archivedTpl.length}종</div></div>`;
}
function setS(k,v){DB.settings[k]=v;save();}
function setGoal(k,v){if(!isAdmin())return;if(k==='perWeek')DB.settings.perWeek=+v;else DB.settings.goals[k]=+v;save();render();}
function backup(){const b=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),by:meName(),workspace:Object.fromEntries(WS_KEYS.map(k=>[k,DB[k]])),contents:DB.contents},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.download='nicott_backup_'+new Date().toISOString().slice(0,10)+'.json';a.href=URL.createObjectURL(b);a.click();toast('백업 파일을 내려받았습니다');}
function restore(file){notice('v2부터는 공용 저장소가 원본이라 백업 파일로 덮어쓰지 않습니다. 옛 데이터는 [이 기기 데이터 옮기기]를 써 주세요.');}
function resetAll(){clearLocalCache();}
/* ── 이벤트 ── */
document.addEventListener('dragover',e=>{e.preventDefault();const d=document.getElementById('drop');if(d)d.classList.add('over');});
document.addEventListener('dragleave',e=>{const d=document.getElementById('drop');if(d&&e.relatedTarget===null)d.classList.remove('over');});
document.addEventListener('drop',e=>{e.preventDefault();const d=document.getElementById('drop');if(d){d.classList.remove('over');if(S.pages.length&&e.dataTransfer.files.length)onFiles(e.dataTransfer.files);}});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
  if(e.key==='ArrowLeft')goPage(S.cur-1);if(e.key==='ArrowRight')goPage(S.cur+1);});
function cancelEdit(){resetMake();S.view='contents';render();}
render();
cloudBoot();
</script>
</body>
</html>
