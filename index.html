<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NICOTT 콘텐츠 대시보드 v1.1</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;200;300;400;500;700&family=Questrial&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--sand:#D6C3B0;--terra:#E05A33;--cream:#ECEAE4;--forest:#2F4433;--paper:#FAF8F4;--sand-lt:#EAE0D5;
--ink:#2A2724;--ink-sub:#8C8377;--ui-bg:#F4F2EE;--ui-line:#E4DFD7;--ok:#4E7A52;--bad:#B24A3C;--warn:#B8842F;
--en:'Questrial',sans-serif;--kr:'Noto Sans KR',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--kr);color:var(--ink);background:var(--ui-bg);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#CFC8BC;border-radius:9px}
.app{display:grid;grid-template-columns:206px 1fr 392px;min-height:100vh}
.side{background:var(--forest);color:#fff;padding:18px 13px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--en);letter-spacing:.4em;font-size:15px;text-transform:uppercase}
.ver{font-size:10px;color:rgba(255,255,255,.45);margin-bottom:18px}
.nav{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.nav button{text-align:left;padding:8px 11px;border-radius:7px;font-size:13px;color:rgba(255,255,255,.72);display:flex;justify-content:space-between;gap:8px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:rgba(255,255,255,.14);color:#fff;font-weight:500}
.nav .n{font-family:var(--en);font-size:10.5px;opacity:.5}
.gm{border-top:1px solid rgba(255,255,255,.15);padding-top:13px}
.gm h4{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.5);margin-bottom:9px;font-weight:400}
.gmr{margin-bottom:8px}.gmr .t{display:flex;justify-content:space-between;font-size:10.5px;color:rgba(255,255,255,.8);margin-bottom:3px}
.gmb{height:4px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.gmb i{display:block;height:100%;background:var(--sand);border-radius:3px}.gmb i.over{background:var(--terra)}
.sfoot{margin-top:14px;font-size:9.5px;color:rgba(255,255,255,.4);line-height:1.7;border-top:1px solid rgba(255,255,255,.13);padding-top:10px}
main{padding:18px 22px 60px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:2px;flex-wrap:wrap}
.ph h1{font-size:21px;font-weight:300;letter-spacing:-.02em}
.ph .st{font-family:var(--en);font-size:11px;letter-spacing:.22em;color:var(--terra)}
.psub{color:var(--ink-sub);font-size:12px;margin-bottom:13px}
.card{background:#fff;border:1px solid var(--ui-line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card h3{font-size:13.5px;font-weight:500;margin-bottom:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.badge{font-family:var(--en);font-size:9.5px;letter-spacing:.1em;padding:2px 7px;border-radius:20px;background:var(--cream);color:var(--ink-sub)}
.badge.t{background:#FBEDE8;color:var(--terra)}
.hint{font-size:11px;color:var(--ink-sub);margin-bottom:10px;line-height:1.65}
.steps{display:flex;gap:6px;margin-bottom:13px;flex-wrap:wrap;align-items:center}
.steps div{font-size:11px;padding:5px 11px;border-radius:20px;background:#fff;border:1px solid var(--ui-line);color:var(--ink-sub)}
.steps div.on{background:var(--ink);border-color:var(--ink);color:#fff}
.steps div.done{background:var(--cream);border-color:var(--cream);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.chips button{font-size:11.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--ui-line);background:#fff;color:var(--ink-sub)}
.chips button:hover{border-color:var(--ink-sub)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips button .c{font-size:10px;opacity:.6;margin-left:4px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:10px}
.scard{background:#fff;border:1px solid var(--ui-line);border-radius:12px;padding:11px;text-align:left;position:relative}
.scard:hover{border-color:var(--ink-sub)}
.scard.on{border-color:var(--terra);box-shadow:0 0 0 2px rgba(224,90,51,.15)}
.scard .strip{display:flex;gap:3px;margin-bottom:8px}
.scard .strip .mini{flex:1;overflow:hidden;position:relative;background:var(--cream);border-radius:4px}
.scard .strip .mini .sc{position:absolute;top:0;left:0;transform-origin:top left}
.scard b{display:block;font-size:12.5px;font-weight:500}
.scard span{display:block;font-size:10.5px;color:var(--ink-sub);margin-top:2px;line-height:1.5}
.scard.new{border-style:dashed;display:flex;align-items:center;justify-content:center;min-height:140px;color:var(--ink-sub);font-size:12px;text-align:center}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:9px}
.tcard{background:#fff;border:1px solid var(--ui-line);border-radius:10px;overflow:hidden;text-align:left;position:relative}
.tcard:hover{border-color:var(--ink-sub)}
.tcard.on{border-color:var(--terra);box-shadow:0 0 0 2px rgba(224,90,51,.15)}
.tcard .th{width:100%;overflow:hidden;position:relative;background:var(--paper)}
.tcard .th .sc{position:absolute;top:0;left:0;transform-origin:top left}
.tcard .m{padding:6px 8px 8px}
.tcard .m b{display:block;font-size:11px;font-weight:500}
.tcard .m span{display:block;font-size:9.5px;color:var(--ink-sub);margin-top:1px}
.tcard .act{position:absolute;top:5px;right:5px;display:flex;gap:4px}
.tcard .act button{width:23px;height:23px;border-radius:7px;background:rgba(255,255,255,.92);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--ink-sub);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tcard .act button:hover{background:#fff;color:var(--ink)}
.tcard .act button.fav{color:var(--terra)}
.ratio{position:absolute;top:5px;left:5px;font-size:8.5px;padding:2px 6px;border-radius:20px;background:rgba(255,255,255,.9);color:var(--ink-sub);font-family:var(--en)}
.pstrip{display:flex;gap:7px;overflow-x:auto;padding:3px 3px 9px}
.pchip{flex:0 0 70px;border-radius:9px;overflow:hidden;border:2px solid transparent;background:#fff;position:relative}
.pchip.on{border-color:var(--terra)}
.pchip .th{width:100%;overflow:hidden;position:relative;background:var(--cream)}
.pchip .th .sc{position:absolute;top:0;left:0;transform-origin:top left}
.pchip .lb{font-size:8.5px;padding:3px;text-align:center;color:var(--ink-sub);background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px #fff}
.pchip .dot.ok{background:var(--ok)}
.padd{flex:0 0 70px;border:1.5px dashed var(--ui-line);border-radius:9px;color:var(--ink-sub);font-size:10.5px;display:flex;align-items:center;justify-content:center;min-height:92px;background:#fff}
.field{margin-bottom:10px}
.field label{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-sub);margin-bottom:4px;gap:8px}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],.field textarea,.field select{width:100%;padding:8px 10px;border:1px solid var(--ui-line);border-radius:8px;background:#fff;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--ink-sub)}
.field textarea{resize:vertical;min-height:52px;line-height:1.6}
.cnt{font-size:9.5px;color:var(--ink-sub)}
.fs{display:flex;gap:2px;align-items:center}
.fs button{width:19px;height:19px;border-radius:5px;background:var(--cream);font-size:11px;line-height:1;color:var(--ink-sub);display:flex;align-items:center;justify-content:center}
.fs span{font-size:9px;color:var(--ink-sub);min-width:24px;text-align:center;font-family:var(--en)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.drop{border:1.5px dashed var(--ui-line);border-radius:11px;padding:16px 14px;text-align:center;background:var(--paper)}
.drop.over{border-color:var(--terra);background:#FCF2EE}
.drop b{display:block;font-size:12.5px;font-weight:400;margin-bottom:2px}
.drop span{font-size:10.5px;color:var(--ink-sub)}
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-top:8px}
.samples button{aspect-ratio:1;border-radius:7px;border:2px solid transparent;background-size:cover;background-position:center}
.samples button:hover{border-color:var(--sand)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:7px}
.slot{border:1px solid var(--ui-line);border-radius:9px;padding:6px;background:#fff}
.slot .pv{width:100%;aspect-ratio:1;border-radius:6px;background:var(--cream) center/cover;margin-bottom:5px}
.slot b{font-size:10px;font-weight:500;display:block}
.slot span{font-size:9px;color:var(--ink-sub);display:block;margin-bottom:4px}
.capvars{display:flex;flex-direction:column;gap:7px;margin-bottom:9px}
.capvar{border:1px solid var(--ui-line);border-radius:9px;padding:9px 11px;background:#fff;text-align:left;font-size:11.5px;line-height:1.75;white-space:pre-wrap;color:#4a443b}
.capvar.on{border-color:var(--terra);background:#FEF9F7}
.capvar .lbl{font-family:var(--en);font-size:9px;letter-spacing:.16em;color:var(--terra);display:block;margin-bottom:4px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;align-items:center}
.btn{padding:7px 13px;border-radius:8px;font-size:12px;border:1px solid var(--ui-line);background:#fff;white-space:nowrap}
.btn:hover{border-color:var(--ink-sub)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#3d3833}
.btn.terra{background:var(--terra);color:#fff;border-color:var(--terra)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed;background:#f5f3ef}
.btn:disabled:hover{border-color:var(--ui-line)}
.why{font-size:10.5px;color:var(--ink-sub);margin-top:5px;line-height:1.6}.why b{color:var(--bad);font-weight:500}
.chk{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--ui-line);font-size:12px;align-items:flex-start;cursor:pointer}
.chk:last-of-type{border-bottom:0}
.chk input{margin-top:3px;width:15px;height:15px;accent-color:var(--forest);flex:0 0 15px}
.chk .auto{font-size:9.5px;padding:1px 7px;border-radius:20px;margin-left:auto;white-space:nowrap;align-self:center}
.chk .auto.pass{background:#E9F1E9;color:var(--ok)}.chk .auto.fail{background:#FBEAE6;color:var(--bad)}
.gate{border-radius:9px;padding:10px 12px;font-size:11.5px;margin-top:10px;line-height:1.7}
.gate.no{background:#FBEAE6;color:#8E3729}.gate.yes{background:#E9F1E9;color:#2F5233}
.gate.info{background:#EDF1F7;color:#3A5478}
.qrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ui-line)}
.qrow .th{width:36px;height:45px;border-radius:5px;background:var(--cream) center/cover;flex:0 0 36px}
.qrow .info{flex:1;min-width:0}.qrow .info b{display:block;font-size:12px;font-weight:500}
.qrow .info span{font-size:10.5px;color:var(--ink-sub)}
.tag{font-size:9.5px;padding:2px 8px;border-radius:20px;background:var(--cream);color:var(--ink-sub);white-space:nowrap}
.tag.draft{background:#EFEDE8}.tag.sch{background:#E8EDF5;color:#3F5B8B}.tag.due{background:#FBEDE8;color:var(--terra)}.tag.pub{background:#E9F1E9;color:var(--ok)}
.empty{text-align:center;padding:24px 14px;color:var(--ink-sub);font-size:11.5px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .hd{font-size:10.5px;color:var(--ink-sub);text-align:center;padding:4px 0}
.cal .d{min-height:66px;border:1px solid var(--ui-line);border-radius:8px;padding:5px;background:#fff;font-size:10.5px;position:relative;text-align:left}
.cal .d.out{background:#F7F5F2;color:#BDB6AA}
.cal .d.today{border-color:var(--terra)}
.cal .d .n{font-family:var(--en);font-size:11px;color:var(--ink-sub)}
.cal .d .ev{margin-top:3px;font-size:9px;padding:2px 4px;border-radius:4px;background:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .d .ev.p{background:#E8EDF5;color:#3F5B8B}.cal .d .ev.l{background:#EAF0E8;color:#4E7A52}
.cal .d .ev.s{background:#F4EDE4;color:#8A6A3E}.cal .d .ev.e{background:#FBEDE8;color:var(--terra)}
.cal .d{cursor:pointer;transition:.12s}
.cal .d:hover{border-color:var(--ink-sub);background:#FDFCFA}
.cal .d:not(.out):empty::after,.cal .d .plus{position:absolute;right:6px;bottom:5px;font-size:13px;color:#D5CEC2}
.cal .d .plus{opacity:0;transition:.12s}
.cal .d:hover .plus{opacity:1}
.cal .d.sel{border-color:var(--terra);box-shadow:0 0 0 2px rgba(224,90,51,.14)}
.cal .d .ev{display:flex;justify-content:space-between;gap:3px;align-items:center}
.cal .d .ev b{font-weight:400;overflow:hidden;text-overflow:ellipsis}
.cal .d .ev i{font-style:normal;opacity:.55;flex:0 0 auto;padding:0 1px}
.cal .d .ev i:hover{opacity:1;color:var(--bad)}
.dayp{border:1px solid var(--ui-line);border-radius:10px;padding:12px 14px;background:var(--paper);margin-top:11px}
.dayp h4{font-size:12.5px;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.wk{display:flex;gap:4px;flex-wrap:wrap}
.wk button{width:30px;height:30px;border-radius:8px;border:1px solid var(--ui-line);background:#fff;font-size:11.5px;color:var(--ink-sub)}
.wk button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.inl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inl input,.inl select{padding:6px 9px;border:1px solid var(--ui-line);border-radius:8px;font-size:12px;background:#fff}
.inl input[type=text]{flex:1;min-width:120px}
.kindpill{font-size:9.5px;padding:2px 7px;border-radius:20px;background:var(--cream);color:var(--ink-sub)}
.acc{border:1px solid var(--ui-line);border-radius:9px;overflow:hidden;margin-top:9px}
.acc>summary{padding:9px 12px;font-size:12px;cursor:pointer;background:#fff;list-style:none;display:flex;justify-content:space-between;align-items:center}
.acc>summary::-webkit-details-marker{display:none}
.acc>div{padding:10px 12px;border-top:1px solid var(--ui-line);background:var(--paper)}
.conn{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:20px}
.conn.on{background:#E9F1E9;color:var(--ok)}.conn.off{background:#F2EFEA;color:var(--ink-sub)}
/* preview */
.prev{background:#DEDAD3;padding:0 0 24px;position:sticky;top:0;height:100vh;overflow:auto;border-left:1px solid var(--ui-line)}
.pvbar{position:sticky;top:0;z-index:5;background:rgba(222,218,211,.96);backdrop-filter:blur(6px);padding:11px 15px;border-bottom:1px solid #CFC8BC;display:flex;gap:7px;align-items:center}
.pvbar .lbl{font-size:11px;color:#5b544a;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvbody{padding:13px 15px 0}
.stage{width:100%;background:#fff;border-radius:5px;overflow:hidden;position:relative;box-shadow:0 8px 26px rgba(42,39,36,.15)}
.stage .sc{position:absolute;top:0;left:0;transform-origin:top left}
.pnav{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:9px}
.pnav button{width:25px;height:25px;border-radius:6px;background:#fff;font-size:13px;color:var(--ink-sub)}
.pnav button:disabled{opacity:.35}
.pnav span{font-size:10.5px;color:#6f675c;font-family:var(--en);min-width:50px;text-align:center}
.srow{display:flex;align-items:center;gap:8px;margin-top:10px;background:#fff;border-radius:8px;padding:7px 10px}
.srow label{font-size:10.5px;color:var(--ink-sub);white-space:nowrap}
.srow input[type=range]{flex:1;accent-color:var(--terra)}
.srow b{font-size:10.5px;font-family:var(--en);min-width:32px;text-align:right}
.capprev{margin-top:9px;background:#fff;border-radius:9px;padding:10px 12px;font-size:11px;line-height:1.8;white-space:pre-wrap;color:#4a443b;max-height:150px;overflow:auto}
.capprev .h{font-size:9px;letter-spacing:.14em;color:var(--ink-sub);margin-bottom:5px;font-family:var(--en)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:12.5px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
/* ═══ 템플릿 캔버스 ═══ */
.tpl{position:relative;overflow:hidden;font-family:var(--kr);font-weight:300;--ts:1;width:var(--cw,1080px);height:var(--ch,1350px);background:var(--bg);color:var(--fg)}
.tpl .im{background-position:center;background-size:cover;background-repeat:no-repeat;background-color:#E7E2DA;border-radius:var(--rad)}
.sk-ever{--bg:#FAF8F4;--bg2:#EAE0D5;--panel:#ECEAE4;--fg:#2A2724;--sub:#8C8377;--acc:#E05A33;--edge:#DCD3C8;--rad:0px;--hw:200;--sh:0 44px 90px rgba(42,39,36,.16);--band:#D6C3B0;--dark:#2F4433}
.sk-edit{--bg:#ECEAE4;--bg2:#FAF8F4;--panel:#FAF8F4;--fg:#231F1C;--sub:#6E6558;--acc:#231F1C;--edge:#C6BDAE;--rad:0px;--hw:500;--sh:none;--band:#CFC6B6;--dark:#231F1C}
.sk-soft{--bg:#FBF7F1;--bg2:#F3EBDD;--panel:#FFFDFA;--fg:#4A423A;--sub:#9C9285;--acc:#C9A98C;--edge:#EBE3D7;--rad:30px;--hw:300;--sh:0 30px 66px rgba(42,39,36,.10);--band:#E7D9C6;--dark:#5C4C40}
.sk-bold{--bg:#2F4433;--bg2:#E05A33;--panel:#FAF8F4;--fg:#FAF8F4;--sub:rgba(250,248,244,.74);--acc:#D6C3B0;--edge:rgba(250,248,244,.3);--rad:0px;--hw:500;--sh:none;--band:#D6C3B0;--dark:#E05A33}
.wm{font-family:var(--en);letter-spacing:.44em;text-transform:uppercase;font-size:calc(26px*var(--ts));color:var(--fg)}
.wm.lt{color:#fff}
.hair{height:1px;background:var(--edge)}
.A1{display:flex;flex-direction:column;align-items:center}
.A1 .wm{margin-top:80px}.A1 .im{width:756px;height:756px;margin-top:80px}
.A1 .nm{margin-top:80px;font-size:calc(46px*var(--ts)*var(--f,1));font-weight:var(--hw);letter-spacing:-.02em}
.A1 .cl{margin-top:20px;font-family:var(--en);font-size:calc(24px*var(--ts));letter-spacing:.34em;color:var(--sub)}
.A1 .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);margin-top:40px}
.A2{background:var(--bg2)}
.A2 .tp{position:absolute;top:78px;left:84px;right:84px;display:flex;justify-content:space-between;align-items:center}
.A2 .kk{font-family:var(--en);font-size:calc(21px*var(--ts));letter-spacing:.3em;color:var(--acc)}
.A2 .hd{position:absolute;top:186px;left:84px;right:84px;font-size:calc(62px*var(--ts)*var(--f,1));font-weight:var(--hw);line-height:1.36;letter-spacing:-.025em}
.A2 .ld{position:absolute;top:400px;left:84px;right:120px;font-size:calc(29px*var(--ts)*var(--f2,1));line-height:1.7;color:var(--sub)}
.A2 .im{position:absolute;right:0;bottom:118px;width:796px;height:672px}
.A2 .br{position:absolute;bottom:0;left:0;right:0;height:118px;background:var(--bg);display:flex;align-items:center;padding:0 84px}
.A2 .br i{width:56px;height:1px;background:var(--acc);margin-right:24px;display:block}

function renderData(tpl,v,z){
  return String(tpl.html||'').replace(/\{\{(?:(bg|nl|fs|fs2):)?([\w]+)\}\}/g,(m,kind,k)=>{
    if(kind==='bg')return bg(v[k]);
    if(kind==='nl')return nl(v[k]);
    if(kind==='fs')return z(k);
    if(kind==='fs2')return z(k,2);
    return esc(v[k]);
  });
}

  o.r=(v,z)=>renderData(o,v,z);
  o.custom=true;
  return o;
}

    TB(S.pages[pi].tpl).f.filter(f=>f.t==='image').forEach(f=>{if(!S.pages[pi].v[f.k]&&tg.length<arr.length)tg.push([pi,f.k]);});
  if(!tg.length){const f0=TB(CP().tpl).f.find(f=>f.t==='image');if(f0)tg.push([S.cur,f0.k]);}
  tg.forEach(([pi,k])=>{const file=arr[idx++];if(!file)return;const r=new FileReader();r.onload=e=>{S.pages[pi].v[k]=e.target.result;render();};r.readAsDataURL(file);});}

function saveAndPublish(){

function saveContent(status){
  const dEl=document.getElementById('schD'),tEl=document.getElementById('schT');
  let when=null;
  if(status==='scheduled'){
    const ds=(dEl?.value||'').trim(),ts=/^\d{2}:\d{2}$/.test(tEl?.value||'')?tEl.value:'19:00';
    const dt=/^\d{4}-\d{2}-\d{2}$/.test(ds)?new Date(ds+'T'+ts):null;
    if(!dt||isNaN(dt.getTime())){alert('예약 날짜와 시각을 확인해 주세요.');return;}
    when=dt.toISOString();
  }
  const bk=S.set?.bk||TB(S.pages[0].tpl).bk;
  const prev=DB.contents.find(c=>c.id===S.editingId);
  const rec={id:S.editingId||('C'+Date.now()),title:(S.set?.nm||'단일')+' · '+(S.pages[0].v.title||S.pages[0].v.name||S.pages[0].v.head||'').split('\n')[0].slice(0,18),
    setId:S.set?.id||null,skin:S.skin,speaker:S.speaker,bk,kind:prev?.kind||kindOf({bk}),channel:prev?.channel||(S.set?.story?'story':'feed'),
    pages:JSON.parse(JSON.stringify(S.pages)),caption:curCap(),
    status,scheduledAt:status==='scheduled'?when:null,createdAt:new Date().toISOString(),thumb:S.pages[0].v.img1||''};
  const i=DB.contents.findIndex(c=>c.id===rec.id);
  if(i>=0)DB.contents[i]=rec;else DB.contents.push(rec);
  save();S.editingId=null;S.set=null;S.pages=[];S.cur=0;S.step=1;S.checks=[];S.capList=[];S.capEdited=null;
  S.view=status==='scheduled'?'calendar':'contents';render();toast(status==='scheduled'?'예약했습니다':'임시 저장했습니다');
}

async function ghPutText(path,text,msg){
  const s=DB.settings,url=`https://api.github.com/repos/${s.ghOwner}/${s.ghRepo}/contents/${path}`;
  let sha=null;
  try{const g=await fetch(url+'?ref='+(s.ghBranch||'main'),{headers:{Authorization:'Bearer '+s.ghToken}});
    if(g.ok){const j=await g.json();sha=j.sha;}}catch(e){}
  const body={message:msg||('update '+path),content:btoa(unescape(encodeURIComponent(text))),branch:s.ghBranch||'main'};
  if(sha)body.sha=sha;
  const r=await fetch(url,{method:'PUT',headers:{Authorization:'Bearer '+s.ghToken,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();if(!r.ok)throw new Error(j.message||('저장 실패 '+r.status));return j;
}

   <div class="inl"><select id="rKind">${Object.keys(KINDS).map(k=>`<option value="${k}" ${S.rep.kind===k?'selected':''}>${KINDS[k].nm}</option>`).join('')}</select>
    <input type="time" id="rTime" value="${S.rep.time}" style="width:138px">
    <select id="rSpan"><option value="month">이번 달 남은 기간</option><option value="4w">앞으로 4주</option></select>
    <button class="btn primary" ${S.rep.days.length?'':'disabled'} onclick="applyRepeat()">일괄 적용</button></div>
   ${S.rep.days.length?`<div class="why">선택: ${S.rep.days.map(i=>'일월화수목금토'[i]).join('·')}요일</div>`:''}</div>
  <details class="acc"><summary><span>이번 달 비율 · 목표 대비 ${Object.keys(MIXLABEL).filter(k=>(c[k]||0)<Math.round(target*g[k]/100)).length}개 유형 부족</span><span class="cnt">펼치기</span></summary>
   <div>${Object.keys(MIXLABEL).map(k=>{const want=Math.round(target*g[k]/100),have=c[k]||0;
     return `<div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--ui-line)">
       <span>${MIXLABEL[k]}</span><span style="color:${have>=want?'var(--ok)':'var(--warn)'}">${have} / ${want}건</span></div>`;}).join('')}
   <div class="why" style="margin-top:7px">목표 비율은 설정 탭에서 조정합니다.</div></div></details>`;
}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function selDay(ds){S.selDay=S.selDay===ds?null:ds;render();}
function togDay(i){const a=S.rep.days,j=a.indexOf(i);j>=0?a.splice(j,1):a.push(i);a.sort();render();}
function presetDays(p){S.rep.days=p==='all'?[0,1,2,3,4,5,6]:p==='wd'?[1,2,3,4,5]:p==='we'?[0,6]:[];render();}
function mkEvent(kind,dateStr,time,title){
  const k=KINDS[kind]||KINDS.life,s=ALL_SETS().find(x=>x.id===k.set)||BASE_SETS[0];
  const tm=/^\d{2}:\d{2}$/.test(time)?time:'19:00';
  const dt=/^\d{4}-\d{2}-\d{2}$/.test(dateStr)?new Date(dateStr+'T'+tm):null;
  if(!dt||isNaN(dt.getTime()))throw new Error('날짜 형식이 올바르지 않습니다: '+dateStr);
  return {id:'C'+Date.now()+Math.floor(Math.random()*1000),title:title||k.nm,setId:s.id,skin:S.skin,speaker:s.sp,
    bk:k.bk,kind,channel:k.ch,pages:s.pages.map(newPage),caption:'',status:'scheduled',
    scheduledAt:dt.toISOString(),createdAt:new Date().toISOString(),thumb:''};
}
function addDayEvent(){
  const t=(document.getElementById('qTitle')?.value||'').trim();
  const k=document.getElementById('qKind')?.value||'life';
  const tm=/^\d{2}:\d{2}$/.test(document.getElementById('qTime')?.value||'')?document.getElementById('qTime').value:'19:00';
  if(!S.selDay)return;
  DB.contents.push(mkEvent(k,S.selDay,tm,t));save();render();toast('일정을 추가했습니다');
}
function applyRepeat(){
  const k=document.getElementById('rKind')?.value||'life';
  const tm=/^\d{2}:\d{2}$/.test(document.getElementById('rTime')?.value||'')?document.getElementById('rTime').value:'19:00';
  const span=document.getElementById('rSpan')?.value||'month';
  S.rep.kind=k;S.rep.time=tm;
  const today=new Date();today.setHours(0,0,0,0);
  const base=S.calMonth?new Date(S.calMonth+'-01'):new Date();
  let from,to;
  if(span==='4w'){from=new Date(today);to=new Date(today);to.setDate(to.getDate()+28);}
  else{const y=base.getFullYear(),m=base.getMonth();from=new Date(Math.max(new Date(y,m,1),today));to=new Date(y,m+1,0);}
  let n=0;
  for(let d=new Date(from);d<=to;d.setDate(d.getDate()+1)){
    if(!S.rep.days.includes(d.getDay()))continue;
    const ds=ymd(d);
    if(DB.contents.some(c=>c.scheduledAt&&ymd(new Date(c.scheduledAt))===ds&&c.kind===k))continue;
    DB.contents.push(mkEvent(k,ds,tm));n++;
  }
  save();render();toast(n?`${n}건을 일괄 추가했습니다`:'추가할 날짜가 없습니다');
}
function autoFill(){
  const mk=S.calMonth||thisMonth(),plan=proposePlan(mk);
  if(!plan.length){toast('이미 목표를 충족했습니다');return;}
  plan.forEach(p=>{const kind=Object.keys(KINDS).find(k=>KINDS[k].bk===p.bk&&KINDS[k].ch==='feed')||'life';
    if(!DB.contents.some(c=>c.scheduledAt&&ymd(new Date(c.scheduledAt))===p.date&&c.bk===p.bk))
      DB.contents.push(mkEvent(kind,p.date,'19:00'));});
  save();render();toast(`${plan.length}건을 캘린더에 채웠습니다`);
}
let PLAN=[];
function proposePlan(mk){
  const c=tally(mk),g=DB.settings.goals,target=Math.round(DB.settings.perWeek*4.3);
  const need=[];Object.keys(MIXLABEL).forEach(k=>{const want=Math.round(target*g[k]/100),have=c[k]||0;
    for(let i=0;i<Math.max(0,want-have);i++)need.push(k);});
  const setFor={product:'S1',lifestyle:'S5',story:'S3',event:'S4'};
  const [y,m]=mk.split('-').map(Number);
  const today=new Date();const startDay=(today.getFullYear()===y&&today.getMonth()+1===m)?today.getDate()+1:1;
  const daysInM=new Date(y,m,0).getDate();
  const gap=Math.max(1,Math.floor(7/DB.settings.perWeek));
  PLAN=need.slice(0,24).map((bk,i)=>{
    let day=startDay+i*gap;if(day>daysInM)day=daysInM;
    const s=ALL_SETS().find(x=>x.id===setFor[bk])||BASE_SETS[0];
    return{bk,setId:s.id,setName:s.nm,date:`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`,
      why:`${MIXLABEL[bk]} 부족분 보충`};});
  return PLAN;
}
function addPlan(i){const p=PLAN[i];if(!p)return;
  const s=ALL_SETS().find(x=>x.id===p.setId);
  DB.contents.push({id:'C'+Date.now()+i,title:`(계획) ${s.nm}`,setId:s.id,skin:S.skin,speaker:s.sp,bk:p.bk,
    pages:s.pages.map(newPage),caption:'',status:'scheduled',scheduledAt:new Date(p.date+'T19:00').toISOString(),
    createdAt:new Date().toISOString(),thumb:''});
  save();render();toast('캘린더에 추가했습니다');}
function addAllPlan(){PLAN.forEach((_,i)=>addPlan(i));toast('제안을 모두 추가했습니다');}
function startFromPlan(i){const p=PLAN[i];if(!p)return;pickSet(p.setId);S.view='make';S.step=2;render();}
function moveMonth(d){const base=S.calMonth?new Date(S.calMonth+'-01'):new Date();base.setMonth(base.getMonth()+d);
  S.calMonth=base.getFullYear()+'-'+String(base.getMonth()+1).padStart(2,'0');render();}
/* ══ 설정 ══ */

  <div class="card"><h3>인스타그램 연동 <span class="conn ${igReady()?'on':'off'}">${igReady()?'연결됨 · @'+esc(s.igUsername||''):'미연결'}</span></h3>
   <div class="hint"><b>이미 비즈니스 계정이면 앱 심사가 필요 없습니다.</b> 본인 계정만 쓰는 앱은 Standard Access로 충분합니다 (Meta 공식). 토큰만 발급하면 바로 게시됩니다.</div>
   <details class="acc"><summary><span>토큰 발급 방법 (10분)</span><span class="cnt">펼치기</span></summary><div style="font-size:12px;line-height:1.95;color:#5f584d">

   <div class="field" style="margin-top:9px"><label><span>액세스 토큰</span></label><input type="text" placeholder="IGQ... 붙여넣기" value="${esc(s.metaToken)}" oninput="setS('metaToken',this.value)"></div>
   <div class="tools"><button class="btn primary" onclick="testIG()">연결 테스트</button>
    <span style="font-size:11px;color:var(--ink-sub)">${s.igUserId?'계정 ID '+esc(s.igUserId):'테스트하면 ID가 채워집니다'}</span></div></div>
  <div class="card"><h3>이미지 저장소 <span class="conn ${ghReady()&&s.ghOk?'on':'off'}">${ghReady()&&s.ghOk?'연결됨':'미연결'}</span></h3>
   <div class="hint">인스타는 <b>공개 주소에 있는 이미지</b>만 가져갑니다. 그래서 만든 이미지를 GitHub 공개 저장소에 올린 뒤 그 주소로 게시합니다. 무료입니다.</div>
   <details class="acc"><summary><span>저장소 만드는 방법 (5분)</span><span class="cnt">펼치기</span></summary><div style="font-size:12px;line-height:1.95;color:#5f584d">
   ① github.com 가입(구글 계정 가능) → <b>New repository</b> → 이름 예: <code>nicott-media</code> → <b>Public</b> 선택 → Create<br>
   ② 우측 상단 프로필 → Settings → Developer settings → <b>Personal access tokens (Fine-grained)</b><br>
   ③ Repository access는 방금 만든 저장소만, 권한은 <b>Contents: Read and write</b><br>
   ④ 생성된 토큰을 아래에 붙여넣고 [연결 테스트]</div></details>
   <div class="grid3" style="margin-top:9px"><div class="field"><label><span>사용자명</span></label><input type="text" placeholder="github 아이디" value="${esc(s.ghOwner)}" oninput="setS('ghOwner',this.value)"></div>

    <div class="field"><label><span>브랜치</span></label><input type="text" value="${esc(s.ghBranch)}" oninput="setS('ghBranch',this.value)"></div></div>
   <div class="field"><label><span>액세스 토큰</span></label><input type="text" placeholder="github_pat_..." value="${esc(s.ghToken)}" oninput="setS('ghToken',this.value)"></div>
   <div class="tools"><button class="btn primary" onclick="testGH()">연결 테스트</button>

    <button class="btn" ${ghReady()?'':'disabled'} onclick="pullFromRepo()">저장소에서 불러오기</button>
    <span style="font-size:11px;color:var(--ink-sub)">${s.lastSync?'마지막 동기화 '+new Date(s.lastSync).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'아직 동기화 전'}</span></div>

  <div class="card"><h3>구글 드라이브 사진</h3>

   <div class="field" style="margin-top:9px"><label><span>자주 쓰는 드라이브 링크 (줄바꿈으로 여러 개)</span></label>
    <textarea style="min-height:70px" oninput="setS('driveLinks',this.value)">${esc(s.driveLinks)}</textarea></div>
   <div class="field"><label><span>Google API 키 (선택)</span></label><input type="text" placeholder="AIza... — 넣으면 선택기가 켜집니다" value="${esc(s.driveKey)}" oninput="setS('driveKey',this.value)"></div>

   <div class="why">콘텐츠 ${DB.contents.length}건 · 내 세트 ${DB.mySets.length}개 · 즐겨찾기 ${DB.favTpl.length}종 · 보관 ${DB.archivedTpl.length}종</div></div>`;
}
function setS(k,v){DB.settings[k]=v;save();}
function setGoal(k,v){if(k==='perWeek')DB.settings.perWeek=+v;else DB.settings.goals[k]=+v;save();render();}
function backup(){const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.download='nicott_backup_'+new Date().toISOString().slice(0,10)+'.json';a.href=URL.createObjectURL(b);a.click();toast('백업 파일을 내려받았습니다');}
function restore(file){if(!file)return;const r=new FileReader();
  r.onload=e=>{try{DB=Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(e.target.result));save();render();toast('복원했습니다');}catch(err){alert('복원 실패: '+err.message);}};
  r.readAsText(file);}
function resetAll(){if(!confirm('모든 데이터를 지웁니다. 되돌릴 수 없습니다. 계속할까요?'))return;
  DB=JSON.parse(JSON.stringify(DEF));save();render();toast('초기화했습니다');}

document.addEventListener('dragover',e=>{e.preventDefault();const d=document.getElementById('drop');if(d)d.classList.add('over');});
document.addEventListener('dragleave',e=>{const d=document.getElementById('drop');if(d&&e.relatedTarget===null)d.classList.remove('over');});
document.addEventListener('drop',e=>{e.preventDefault();const d=document.getElementById('drop');if(d){d.classList.remove('over');if(S.pages.length&&e.dataTransfer.files.length)onFiles(e.dataTransfer.files);}});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
  if(e.key==='ArrowLeft')goPage(S.cur-1);if(e.key==='ArrowRight')goPage(S.cur+1);});
render();
