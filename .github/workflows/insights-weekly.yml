name: 자사 피드 성과 수집

# 매주 월요일 오전 9시(한국시간)에 니코트 계정의 최근 게시물 성과를 수집합니다.
# 9월 1일부터 가동 — IG_TOKEN·IG_USER_ID Secrets가 등록되어 있어야 실제 수집됩니다.
# 수집 결과: data/insights/YYYY-MM-DD.json (원본) + data/insights/latest.md (요약)
# 이 데이터는 매월 13일 템플릿 자동 생성과 캡션 제안의 근거로 쓰입니다.
on:
  schedule:
    - cron: '0 0 * * 1'      # UTC 00:00 월요일 = 한국 09:00 월요일
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 키 확인
        id: gate
        env:
          T: ${{ secrets.IG_TOKEN }}
          U: ${{ secrets.IG_USER_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$U" ]; then
            echo "IG_TOKEN / IG_USER_ID 미등록 — 수집을 건너뜁니다 (인스타 연동 후 자동 가동)"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 성과 수집
        if: steps.gate.outputs.skip == 'false'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          node -e '
          const fs=require("fs");
          const T=process.env.IG_TOKEN,U=process.env.IG_USER_ID;
          const API="https://graph.instagram.com/v21.0";
          (async()=>{
            const f="id,caption,media_type,media_product_type,timestamp,like_count,comments_count,permalink";
            const r=await fetch(API+"/"+U+"/media?fields="+f+"&limit=30&access_token="+encodeURIComponent(T));
            const j=await r.json();
            if(j.error){console.log("API 오류:",j.error.message);process.exit(1);}
            const posts=j.data||[];
            for(const p of posts){
              try{
                const ir=await fetch(API+"/"+p.id+"/insights?metric=reach,saved,shares&access_token="+encodeURIComponent(T));
                const ij=await ir.json();
                if(ij.data)for(const m of ij.data)p[m.name]=(m.values&&m.values[0]&&m.values[0].value)||0;
              }catch(e){}
              await new Promise(res=>setTimeout(res,400));
            }
            const today=new Date().toISOString().slice(0,10);
            fs.mkdirSync("data/insights",{recursive:true});
            fs.writeFileSync("data/insights/"+today+".json",JSON.stringify({collected:today,posts},null,2));
            const score=p=>(p.like_count||0)+(p.comments_count||0)*3+(p.saved||0)*5+(p.shares||0)*5;
            const sorted=[...posts].sort((a,b)=>score(b)-score(a));
            const avg=posts.length?Math.round(posts.reduce((s,p)=>s+score(p),0)/posts.length):0;
            const line=p=>"- ["+String((p.caption||"(캡션 없음)")).split("\n")[0].slice(0,40)+"]("+p.permalink+") — 점수 "+score(p)+" (좋아요 "+(p.like_count||0)+" · 댓글 "+(p.comments_count||0)+" · 저장 "+(p.saved||0)+")";
            const md=[];
            md.push("# 자사 피드 성과 스냅샷 — "+today);
            md.push("");
            md.push("최근 "+posts.length+"건 · 평균 반응점수 "+avg+" (좋아요 + 댓글×3 + 저장×5 + 공유×5)");
            md.push("");
            md.push("## 상위 5");
            for(const p of sorted.slice(0,5))md.push(line(p));
            md.push("");
            md.push("## 하위 3");
            for(const p of sorted.slice(-3))md.push(line(p));
            md.push("");
            md.push("> 이 파일은 매주 자동 갱신됩니다. 매월 템플릿·캡션 제안의 근거 데이터로 쓰입니다.");
            fs.writeFileSync("data/insights/latest.md",md.join("\n"));
            console.log("수집 완료",posts.length,"건 · 평균",avg);
          })();
          '

      - name: 결과 커밋
        if: steps.gate.outputs.skip == 'false'
        run: |
          git config user.name "nicott-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/insights || true
          git diff --staged --quiet || git commit -m "주간 성과 스냅샷"
          git push || true

      - name: 주간 요약 이슈
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(date +%Y-%m-%d)
          gh issue create --title "주간 성과 리포트 $D" --body-file data/insights/latest.md || true
