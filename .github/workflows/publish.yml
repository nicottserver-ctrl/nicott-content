name: 예약 발행 점검 (보조)

# v2.0 부터 예약 발행은 대시보드 서버(Cloudflare)가 직접 합니다.
# · 주 점검기: Cloudflare 의 nicott-cron (10분마다)
# · 이 워크플로: 30분마다 같은 점검을 한 번 더 깨우는 보조 장치 — 비밀값이 필요 없습니다.
# 점검 주소는 시각이 지난 '예약됨' 콘텐츠만 올리므로, 여러 번 불려도 중복 게시되지 않습니다.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: 예약 발행 점검 호출
        run: |
          curl -sS -X POST -A "nicott-gh-cron" --max-time 120 https://nicott-content.pages.dev/api/cron/tick || echo "점검 호출 실패 — 다음 회차에 다시 시도합니다"
